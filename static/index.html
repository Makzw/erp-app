          <datalist id="bt_from_wh_opts">${whOpts}</datalist>
        </label>
        <div style="display:flex;align-items:flex-end;gap:6px">
          <div style="flex:1">
            <div style="font-size:12px;color:var(--sub);margin-bottom:4px">🚚 运输工具</div>
            <div style="display:flex;gap:4px;flex-wrap:wrap" id="bt_tools_area">
              <button onclick="addBatchToolRow()" style="padding:5px 10px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-size:11px;cursor:pointer">+ 添加</button>
              <div id="batchToolRows">${renderStockBatchTools()}</div>
            </div>
          </div>
        </div>
      </div>
      <div id="batchScroll" style="flex:1;overflow-y:auto;padding:0;max-height:65vh">
        <div id="batchTableBody"></div>
      </div>
      <div style="padding:12px 16px;display:flex;gap:8px;flex-shrink:0;background:var(--card);border-top:1px solid var(--border)">
        <button onclick="bomBatchOverlayRemove()" style="flex:1;padding:13px;background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">取消</button>
        <button id="batchConfirmBtn" onclick="bomBatchConfirm()" style="flex:2;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">✓ 确认调拨</button>
      </div>
    </div>
    <style>@keyframes slideUp{from{transform:translateY(100%)}}</style>`;
  document.body.appendChild(overlay);
  _setupOverlayClose();
  renderBatchTable(allItems, allWhs, whOpts);
  // 同上：显式聚焦。这里聚焦 TO 仓（★必填、且是自然填写第一步）；
  // 表格首格 FROM 仓目前仍是 select，聚焦后滚轮/字母会直接改仓库值 → 留到组3 换成 datalist 再聚焦
  const _ft = $id('bt_to_wh'); if (_ft) _ft.focus();
}

function bomBatchOverlayRemove() {
  const el = $id('bomBatchOverlay');
  if (el) el.remove();
}

function _setupOverlayClose() {
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') {
      bomBatchOverlayRemove();
      document.removeEventListener('keydown', escHandler);
    }
  });
}

// ponytail: #cmOverlay（材料弹窗 + 批量完工弹窗共用此 id）的 Esc 关闭。
// 只绑一次（window.__cmEscBound），避免每次开窗堆积监听器；按 Esc 时仅当弹窗存在才移除。
function _setupCmOverlayClose() {
  if (window.__cmEscBound) return;
  window.__cmEscBound = true;
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    const el = $id('cmOverlay');
    if (el) el.remove();
  });
}

function renderBatchTable(allItems, allWhs, whOpts) {
  const body = $id('batchTableBody');
  if (!body) return;
  if (!allItems.length) { body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--sub)">无数据</div>'; return; }
  let html = '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  html += '<thead><tr>';
  ['品号','品名','FROM仓','客户代号','指令单号','单重(g)','数量','净重(kg)','外发计划号','备注'].forEach(h => {
    html += `<th style="padding:8px 5px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:2;background:var(--bg)">${h}</th>`;
  });
  html += '</tr></thead>';
  allItems.forEach((item, idx) => {
    const prdNo = item.prd_no || item.PRD_NO || '';
    const prdName = item.prd_name || item.PRD_NAME || '';
    const qty = item.qty || item.QTY || '';
    const ref = item.ref_itm || item.REF_ITM || item.指令单号 || '';
    const ddjh = item.ddjh || item.DDJH || item.外发计划号 || '';
    const cus = item.cus_no || item.CUS_NO || item.客户代号 || '';
    const dz = item.danzhong || item.单重 || '';
    const rem = item.rem || item.REM || item.备注 || '';
    html += `<tr style="border-bottom:1px solid var(--border)">`;
    html += `<td style="padding:6px 5px;font-weight:600">${fmt(prdNo)}</td>`;
    html += `<td style="padding:6px 5px;color:var(--name);font-size:13px;max-width:380px;word-break:break-word;vertical-align:top">${fmt(prdName)}</td>`;
    html += `<td style="padding:6px 5px"><input type="text" class="batch-wh-from" data-idx="${idx}" list="bt_from_wh_opts" placeholder="FROM仓" style="width:130px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--card)"></td>`;
    html += `<td style="padding:6px 5px"><input type="text" class="batch-cus" data-idx="${idx}" value="${escAttr(cus)}" placeholder="客户" style="width:110px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--card)"></td>`;
    html += `<td style="padding:6px 5px"><input type="text" class="batch-ref" data-idx="${idx}" value="${escAttr(ref)}" placeholder="指令单号" style="width:130px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--card)"></td>`;
    html += `<td style="padding:6px 5px"><input type="number" class="batch-dz" data-idx="${idx}" value="${dz}" step="0.001" min="0" placeholder="0" style="width:110px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--card)" oninput="calcBatchJZ(this)"></td>`;
    html += `<td style="padding:6px 5px"><input type="number" class="batch-qty" data-idx="${idx}" value="" min="1" step="1" style="width:120px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--card)" oninput="calcBatchJZ(this)"></td>`;
    html += `<td style="padding:6px 5px"><span class="batch-jz" data-idx="${idx}" style="font-size:13px;color:var(--text);min-width:70px;display:inline-block">—</span></td>`;
    html += `<td style="padding:6px 5px"><input type="text" class="batch-ddjh" data-idx="${idx}" value="${escAttr(ddjh)}" placeholder="外发" style="width:120px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--card)"></td>`;
    html += `<td style="padding:6px 5px"><input type="text" class="batch-rem" data-idx="${idx}" value="${escAttr(rem)}" placeholder="备注" style="width:130px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;background:var(--card)"></td>`;
    html += '</tr>';
  });
  html += '</table>';
  body.innerHTML = html;
  // 回填 FROM 仓默认值 + 净重自动计算
  allItems.forEach((item, idx) => {
    const fromEl = document.querySelector(`.batch-wh-from[data-idx="${idx}"]`);
    if (fromEl) fromEl.value = item.wh || item.WH || '';
    const dzEl = document.querySelector(`.batch-dz[data-idx="${idx}"]`);
    const qtyEl = document.querySelector(`.batch-qty[data-idx="${idx}"]`);
    if (dzEl && qtyEl) {
      const q = parseFloat(qtyEl.value) || 0;
      const d = parseFloat(dzEl.value) || 0;
      if (q > 0 && d > 0) {
        const jzEl = document.querySelector(`.batch-jz[data-idx="${idx}"]`);
        if (jzEl) jzEl.textContent = (q * d / 1000).toFixed(3);
      }
    }
  });
}

function calcBatchJZ(el) {
  const idx = el.getAttribute('data-idx');
  const qtyEl = document.querySelector(`.batch-qty[data-idx="${idx}"]`);
  const dzEl = document.querySelector(`.batch-dz[data-idx="${idx}"]`);
  const jzEl = document.querySelector(`.batch-jz[data-idx="${idx}"]`);
  if (!qtyEl || !dzEl || !jzEl) return;
  const q = parseFloat(qtyEl.value) || 0;
  const d = parseFloat(dzEl.value) || 0;
  jzEl.textContent = (q > 0 && d > 0) ? (q * d / 1000).toFixed(3) + ' kg' : '—';
}

async function bomBatchConfirm() {
  const wh2 = ($id('bt_to_wh')||{value:''}).value.trim();
  if (!wh2) { toast('⚠️ 请先选择 TO 仓库'); return; }
  const rows = [];
  const qtys = document.querySelectorAll('.batch-qty');
  const froms = document.querySelectorAll('.batch-wh-from');
  const refs = document.querySelectorAll('.batch-ref');
  const ddjhs = document.querySelectorAll('.batch-ddjh');
  const cuss = document.querySelectorAll('.batch-cus');
  const dzs = document.querySelectorAll('.batch-dz');
  const rems = document.querySelectorAll('.batch-rem');
  const allItems = [];
  Object.values(bomSelectedByProduct).forEach(rows => {
    Object.values(rows).forEach(r => allItems.push(r));
  });
  // 组3-1b + B4：FROM 仓与数量必填。必须在循环外全量校验 ——
  // forEach 里的 return 只会跳过当前行，不会中止提交（写在这里会以为拦住了其实没拦住）
  for (let i = 0; i < allItems.length; i++) {
    const _w = ((froms[i] && froms[i].value) || allItems[i].wh || allItems[i].WH || '').trim();
    if (!_w) { toast('⚠️ 第 ' + (i + 1) + ' 行 FROM 仓不能为空'); if (froms[i]) froms[i].focus(); return; }
    const _rq = ((qtys[i] && qtys[i].value) || '').trim();
    if (!_rq || !(parseFloat(_rq) > 0)) { toast('⚠️ 第 ' + (i + 1) + ' 行数量不能为空'); if (qtys[i]) qtys[i].focus(); return; }
  }
  allItems.forEach((item, i) => {
    const wh = froms[i] ? froms[i].value : (item.wh || item.WH || '');
    const dz = parseFloat(dzs[i] ? dzs[i].value : '0') || 0;
    // B4：删掉原 `|| (item.qty || item.QTY || 0)` 兜底（空值已在上方拦截；留着会让"空"静默变成"整仓库存全调"）
    const qty = parseFloat(qtys[i] ? qtys[i].value : '0');
    rows.push({
      prd_no: item.prd_no || item.PRD_NO || '',
      qty: qty,
      wh: wh,
      wh2: wh2,
      ref_itm: refs[i] ? refs[i].value.trim() : '',
      ddjh: ddjhs[i] ? ddjhs[i].value.trim() : '',
      cus_no: cuss[i] ? cuss[i].value.trim() : '',
      danzhong: dz,
      jingzhong: calcJZ(qty, dz),   // P0：原为 dz（把单重当净重写进账）
      rem: rems[i] ? rems[i].value.trim() : '',
    });
  });
  if (!rows.length) { toast('⚠️ 无有效调拨项'); return; }
  const btn = $id('batchConfirmBtn');
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
  try {
    const res = await api(BASE + '/stock/transfer', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items: rows, tool_rows: stockBatchTools}),
    });
    if (res && res.error) throw new Error(res.error);   // Step C：后端 200 + {"error"} 的业务错误 → 走 catch（❌ 提示 + 按钮恢复 + 浮层留下可重试）
    toast(`✅ 批量调拨成功 ${res.ic_no}`);
    bomBatchOverlayRemove();
    if (stockData && stockData.prd_no) stockSearchByPRD(stockData.prd_no);
  } catch(e) {
    toast('❌ 批量调拨失败: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '✓ 确认调拨'; }
  }
}

function addBatchToolRow() {
  stockBatchTools = stockBatchTools || [];
  stockBatchTools.push({ code: '', qty: 1 });
  const container = $id('batchToolRows');
  if (container) container.innerHTML = renderStockBatchTools();
}

function removeBatchTool(i) {
  stockBatchTools.splice(i, 1);
  const container = $id('batchToolRows');
  if (container) container.innerHTML = renderStockBatchTools();
}

function renderStockBatchTools() {

    return '<div style="font-size:11px;color:var(--sub);padding:4px 0">暂无运输工具，点击上方 + 添加</div>';
  }
  const tools = window.__transferTools || [];
  const toolOpts = `<option value=""></option>` + tools.map(t => `<option value="${t.code}">${t.code} ${t.name}</option>`).join('');
  return stockBatchTools.map((t, i) => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px">
      <input type="text" class="batch-tool-code" list="btc_${i}" placeholder="工具编号"
        value="${escAttr(t.code||'')}"
        style="flex:2;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:var(--card)"
        oninput="stockBatchTools[${i}].code=this.value">
        <datalist id="btc_${i}">${toolOpts}</datalist>
      <input type="number" class="batch-tool-qty" min="1" placeholder="数量"

      <button onclick="removeBatchTool(${i})" style="width:26px;height:26px;border-radius:50%;border:none;background:#FEE2E2;color:#DC2626;font-size:14px;cursor:pointer">×</button>
    </div>`).join('');

// ── 全局净需求（毛需求 − 供给）────────────────────────────────────────────────
// 只读：所有成品销售未出 → BOM 展开加总 → 减 材料仓/生产仓/在途/请购。
// 后端 GET /api/pmc/global_net（缓存 10 分钟，refresh=1 强制重算）
let gnData = null;
let gnQ = '';
let gnOnlyNet = true;
let gnOnlyAlert = false;

function gnFmt(v, d) {
  var n = Number(v == null ? 0 : v);
  if (!isFinite(n)) return '—';
  return n.toLocaleString('zh-CN', { maximumFractionDigits: (d === undefined ? 2 : d) });
}
function gnEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function gnAlertSoon() { return null; }
function gnHasAlert(prd, alerts) {
  var ks = ['multi_owner', 'unknown_owner', 'no_bom_missing', 'dirty', 'owner_mismatch'];
  for (var i = 0; i < ks.length; i++) {
    var arr = (alerts && alerts[ks[i]]) || [];
    for (var j = 0; j < arr.length; j++) if (arr[j].prd === prd) return true;
  }
  return false;
}

// ── 全厂净需求 → PMC BOM 树 join（slim，约 144KB，10 分钟 TTL）────────────────
// 只回填 DOM，不重渲染：保住用户已填的请购数量/勾选/弹窗状态
window.__gnMap = null;
window.__gnTs = 0;
window.__gnLoading = null;

function gnEnsureMap() {
  if (window.__gnMap && Date.now() - window.__gnTs < 600000) return Promise.resolve();
  if (window.__gnLoading) return window.__gnLoading;
  window.__gnLoading = api(BASE + '/pmc/global_net?slim=1').then(function (d) {
    window.__gnMap = (d && d.map) || {};
    window.__gnTs = Date.now();
    window.__gnLoading = null;
    gnFill();
  }).catch(function () {
    window.__gnMap = {};      // 取不到就显示「—」，不留在「…」
    window.__gnTs = Date.now();
    window.__gnLoading = null;
    gnFill();
  });
  return window.__gnLoading;
}

function gnRowNet(prd) {           // 料行全厂净需求（数据没到 → 0，不误触高亮）
  var v = (window.__gnMap || {})[prd];
  return v ? Number(v[5] || 0) : 0;
}

function gnTotalTagHtml() {        // 页头：本树涉及的品号（去重）全厂净需求合计
  var items = window.__pmcTreeItems || [];
  if (!window.__gnMap) {
    return '<span style="background:#eef2ff;color:#4338ca;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600">全厂净需求 计算中…</span>';
  }
  var seen = {}, tot = 0, cnt = 0;
  for (var i = 0; i < items.length; i++) {
    if (items[i].is_fg) continue;
    var p = items[i].prd_no || '';
    if (seen[p]) continue;
    seen[p] = 1;
    var n = gnRowNet(p);
    tot += n;
    if (n > 0.0001) cnt++;
  }
  var hot = tot > 0.0001;
  return '<span style="background:' + (hot ? '#fee2e2' : '#dcfce7') + ';color:' + (hot ? '#dc2626' : '#16a34a') +
    ';border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600" title="本树涉及的品号（同一品号只算一次）全厂净需求合计；成品行的全厂未出不计入">全厂净需求合计 ' +
    Number(tot).toLocaleString('zh-CN') + ' · ' + cnt + ' 个品号</span>';
}

function gnFill() {
  var nodes = document.querySelectorAll('[data-gnnet]');
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i], prd = el.getAttribute('data-gnprd') || '';
    var h = document.createElement('div');
    h.innerHTML = gnNetHtml(prd);
    if (h.firstChild) el.parentNode.replaceChild(h.firstChild, el);
  }
  // 被上游可用抵（slim map 第 8 位）：map 到位后回填
  var cuts = document.querySelectorAll('[data-gncut]');
  for (var c2 = 0; c2 < cuts.length; c2++) {
    var el2 = cuts[c2], prd2 = el2.getAttribute('data-gnprd') || '';
    var h2 = document.createElement('div');
    h2.innerHTML = gnCutHtml(prd2);
    if (h2.firstChild) el2.parentNode.replaceChild(h2.firstChild, el2);
  }
  // 数据是懒加载的 → 行底色必须回填时一并改（不能被 gnRowNet 的 0 抢先）
  var rows = document.querySelectorAll('[data-gnrow]');
  for (var j = 0; j < rows.length; j++) {
    var p2 = rows[j].getAttribute('data-gnrow') || '';
    if (!p2 || rows[j].getAttribute('data-gnfg')) continue;
    rows[j].style.background = gnRowNet(p2) > 0.0001 ? '#fef9c3' : '';
  }
  // 「需求」列 hover 里的全厂毛需求也要跟着回填（数据懒加载，首屏渲染时还是旧的）
  var reqs = document.querySelectorAll('[data-gnreq]');
  for (var k2 = 0; k2 < reqs.length; k2++) {
    var pr2 = reqs[k2].getAttribute('data-gnreq') || '';
    var gv = (window.__gnMap || {})[pr2];
    if (!gv || gv[0] == null || !reqs[k2].title) continue;
    reqs[k2].title = reqs[k2].title.replace(/全厂毛需求 [^\n（]*/,
      '全厂毛需求 ' + Number(gv[0]).toLocaleString('zh-CN'));
  }
  var ts = $id('gnTotalSpan');
  if (ts) ts.innerHTML = gnTotalTagHtml();
}

// 缺口格下方那行小字：全厂净需求（所有成品的未出展开）。m = [毛需求,材料仓,生产仓,在途,请购,净需求]
function gnNetHtml(prd) {
  var m = window.__gnMap;
  if (!m) {
    return '<div data-gnnet="1" data-gnprd="' + gnEsc(prd) + '" style="font-size:12px;color:var(--sub);white-space:nowrap">全厂净需求 …</div>';
  }
  var v = m[prd];
  if (!v) {
    return '<div style="font-size:12px;color:var(--sub);white-space:nowrap" title="' +
      gnEsc('该品号不在全厂净需求范围（没有全厂毛需求，也没有库存）') + '">全厂净需求 —</div>';
  }
  var g = Number(v[0] || 0), mt = Number(v[1] || 0), pd = Number(v[2] || 0), ow = Number(v[3] || 0), qt = Number(v[4] || 0), net = Number(v[5] || 0);
  var ci = Number(v[6] || 0);   // 母件被归属的在制合计（无则为 0）
  var cutv = Number(v[7] || 0), own = Number(v[8] || 0), gf = Number(v[9] || 0);   // 被上游抵 / 本层自身被抵 / 不滚算毛需求
  var tip = '全厂净需求（全厂口径：所有成品）\n' +
    '不滚算毛需求 ' + gnQty(gf) + '（所有成品未出按 BOM 展开，一分库存都不扣）\n' +
    '− 被上游可用抵 ' + gnQty(cutv) + '\n' +
    '− 本层可用抵扣 ' + gnQty(own) + '（原材料仓/生产仓/在途/请购 里实际被用掉的部分）\n' +
    '= 要做的数（全厂净需求）' + gnQty(net) + '\n\n' +
    '（滚算后的本层毛需求 ' + gnQty(g) + ' = 不滚算毛需求 − 被上游可用抵；料行看小字）\n' +
    '⚠ 这是全厂口径（所有成品），跟左边「缺口」不是一回事：缺口只算本单，是请购/MPS 落库的依据';
  // ⚠ 真实单元格也带 data-gnnet：这样 gnEnsureMap 到位后 gnFill 会重渲染它，
  //   显示「其中 X 在外发/车间在制」——否则树在 map 未到时渲染的那格永远不带标
  return '<div data-gnnet="1" data-gnprd="' + gnEsc(prd) + '" style="font-size:12px;white-space:nowrap;color:' + (net > 0.0001 ? '#b45309' : '#16a34a') +
    '" title="' + gnEsc(tip) + '">全厂净需求 <b style="font-size:13px;font-variant-numeric:tabular-nums">' + gnFmt(net, 0) + '</b>' +
    (ci > 0.0001 ? '<div style="font-size:11px;color:var(--sub);white-space:nowrap" title="' +

    + '</div>'
    + '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:6px">'
    + '<span>成品 <b style="color:#111">' + (d.fg_count || 0) + '</b></span>'
    + '<span>材料 <b style="color:#111">' + (d.material_count || 0) + '</b></span>'
    + '<span>毛需求合计 <b style="color:#111">' + gnFmt(d.gross_total, 0) + '</b></span>'
    + '<span>净需求合计 <b style="color:#DC2626">' + gnFmt(d.net_total, 0) + '</b></span>'
    + '<span title="生产仓现存合计（车间仓+外发仓）。滚算时全部算可用，不再按 MOT 归属抵冲">生产仓 ' + gnFmt(d.prod_total, 0) + '（参考）</span>'
    + '<span>未归属 ' + gnFmt(d.unowned_prod_total, 0) + '</span>'
    + '<span>其中 BOM 兜底归属 <b style="color:#0F766E">' + gnFmt(d.bom_owned_total, 0) + '</b>（' + ((d.bom_owned || []).length) + ' 个品号）</span>'
    + '<span>成品自有库存 <b style="color:#1D4ED8">' + gnFmt(d.fg_self_total, 0) + '</b>（' + ((d.fg_self || []).length) + ' 个，不参与抵冲）</span>'
    + '<span>算法耗时 ' + (d.cost || 0) + 's · 数据时间 ' + dt + ' · 缓存 10 分钟</span>'
    + '</div>'
    + gnAlertBlock('ℹ 生产仓由 BOM 兜底归属（MOT 查不到 → BOM 唯一顶层成品）', bown, ['品号', '生产仓数量', '说明'], '#0F766E')
    + gnAlertBlock('⚠ 生产仓多母件冲突（不参与计算，需人工判定）', multi, ['品号', '生产仓数量', '候选母件'], '#B45309')
    + gnAlertBlock('⚠ 生产仓查不到母件（不参与计算）', unk, ['品号', '生产仓数量', '说明'], '#B45309')
    + gnAlertBlock('⚠ 归属口径不一致（MOT 唯一 vs BOM 唯一 → 指向不同母件，MOT 可能过时）', omm, ['品号', '生产仓数量', '说明'], '#B45309')
    + gnAlertBlock('⛔ 缺 BOM（成品/半成品，需求未计入）', miss, ['品号', '未出量', '说明'], '#DC2626')
    + gnAlertBlock('ℹ 无 BOM 直采件（未出直接当毛需求）', direct, ['品号', '未出量', '说明'], '#6B7280')
    + gnAlertBlock('ℹ 负账面已夹 0', neg, ['品号', '原值', '说明'], '#6B7280')
    + gnAlertBlock('⛔ 库存脏数据（未夹 0，只报警）', drt, ['品号', '材料仓', '说明'], '#DC2626')
    + gnFgSelfBlock(d.fg_self || [], d.fg_self_total || 0)
    + '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 6px;font-size:12px">'
    + '<label style="display:flex;align-items:center;gap:4px"><input type="checkbox" ' + (gnOnlyNet ? 'checked' : '') + ' onchange="gnToggle(\'net\', this.checked)">只看净需求 &gt; 0</label>'
    + '<label style="display:flex;align-items:center;gap:4px"><input type="checkbox" ' + (gnOnlyAlert ? 'checked' : '') + ' onchange="gnToggle(\'alert\', this.checked)">只看有报警的行</label>'
    + '<span id="gnCount" style="color:var(--sub)"></span>'
    + '</div>'
    + '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:1240px">'
    + '<thead><tr style="background:#f3f4f6;color:var(--sub)">'
    + ['品号', '品名', '毛需求', '材料仓', '生产仓', '在途', '请购', '净需求', '归属母件', '涉及成品', '备注']
        .map(function (c) {
          var right = ['毛需求', '材料仓', '生产仓', '在途', '请购', '净需求'].indexOf(c) >= 0;
          return '<th style="padding:6px 8px;' + (right ? 'text-align:right;' : 'text-align:left;') + 'white-space:nowrap">' + c + '</th>';
        }).join('')
    + '</tr></thead><tbody id="gnTbody"></tbody></table></div>'
    + '</div>';
  el.innerHTML = html;
  gnRenderRows();
}
</script>
</body>
</html>
