// PMC BOM 树渲染
function renderPMCTree(items, title) {
  var el = $id('content');
  if (!items || !items.length) { el.innerHTML = '<div class="state-msg">\u65e0 BOM \u6570\u636e</div>'; return; }
  var fgRow = items.find(function(r) { return r.is_fg; });
  var bomRows = items.filter(function(r) { return !r.is_fg; });

  var html = '<div style="padding:12px">';
  html += '<div style="margin-bottom:12px"><button onclick="loadPMC()" style="background:#6b7280;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px">\u2190 \u8fd4\u56de\u5217\u8868</button></div>';
  var totalGap = 0, gapCount = 0;
  for (var gi = 0; gi < items.length; gi++) { if ((items[gi].gap||0) > 0) { totalGap += items[gi].gap||0; gapCount++; } }
  var summaryTag = fgRow ? (totalGap > 0
    ? '<span style="background:#fee2e2;color:#dc2626;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600">\u7f3a ' + totalGap.toLocaleString('zh-CN') + ' \u4ef6 \u5173 ' + gapCount + ' \u9879</span>'
    : '<span style="background:#dcfce7;color:#16a34a;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600">✓ \u5168\u90e8\u5145\u8db3</span>')
    : '';
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap"><div style="font-size:13px;color:var(--sub)">' + (title||'') + '</div>' + summaryTag + '</div>';

  // BOM 表
  html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f3f4f6">';
  html += '<th style="padding:7px 8px;text-align:left">品号</th>';
  html += '<th style="padding:7px 4px;text-align:center">层</th>';
  html += '<th style="padding:7px 4px;text-align:right">需求</th>';
  html += '<th style="padding:7px 4px;text-align:right">销未出</th>';
  html += '<th style="padding:7px 4px;text-align:right">原仓</th>';
  html += '<th style="padding:7px 4px;text-align:right">生仓</th>';
  html += '<th style="padding:7px 4px;text-align:right">在途</th>';
  html += '<th style="padding:7px 4px;text-align:right">在单请</th>';
  html += '<th style="padding:7px 4px;text-align:right">合计</th>';
  html += '<th style="padding:7px 4px;text-align:right;min-width:80px">缺口</th>';
  html += '<th style="padding:7px 4px;text-align:center">调</th>';
  html += '</tr></thead><tbody>';

  var depthColors = ['#1d4ed8','#16a34a','#d97706','#ea580c','#dc2626'];
  for (var i = 0; i < items.length; i++) {
    var r = items[i];
    var isFg = r.is_fg;
    var depth = r.depth || 0;
    var matQty = r.mat_qty || 0;
    var prodQty = r.prod_qty || 0;
    var wayQty = r.qty_on_way || 0;
    var odrQty = r.qty_on_odr || 0;
    var totalStock = r.total_stock || 0;
    var realDemand = r.real_demand || 0;
    var soRemain = r.so_remain || 0;
    var gap = r.gap || 0;
    var bg = isFg ? '#dbeafe' : (gap > 0 ? '#fef9c3' : '');
    var indent = depth * 14;
    var depthColor = depthColors[Math.min(depth, depthColors.length-1)];
    var depthLabel = isFg ? '成' : 'L' + depth;
    var adjBtn = !isFg && depth > 0 ? '<button onclick="pmcOpenAdjust(\'' + escAttr(r.prd_no||'') + '\',\'\',\'mat\',' + matQty + ')" style="padding:3px 6px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:4px;font-size:11px;cursor:pointer;color:#374151">调</button>' : '';
    // 缺口进度条
    var barPct = realDemand > 0 ? Math.min(100, Math.round((totalStock/realDemand)*100)) : 0;
    var barColor = gap > 0 ? '#dc2626' : '#16a34a';
    var gapHtml = gap > 0
      ? '<div style="display:flex;align-items:center;gap:4px"><div style="flex:1;height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden"><div style="width:' + barPct + '%;height:100%;background:' + barColor + ';border-radius:3px"></div></div><span style="font-weight:700;color:' + barColor + ';font-size:11px;min-width:24px;text-align:right;font-variant-numeric:tabular-nums">' + gap + '</span></div>'
      : '<span style="color:#16a34a;font-weight:700">✓</span>';
    // 销未出 / 在途 / 在单
    var soRemainHtml = isFg && soRemain > 0 ? '<span style="color:#6366f1;font-weight:600;font-variant-numeric:tabular-nums">' + Number(soRemain).toLocaleString('zh-CN') + '</span>' : '<span style="font-variant-numeric:tabular-nums">-</span>';
    var wayHtml = wayQty > 0 ? '<span style="color:#f59e0b;font-weight:600;font-variant-numeric:tabular-nums">' + Number(wayQty).toLocaleString('zh-CN') + '</span>' : '<span style="font-variant-numeric:tabular-nums">-</span>';
    var odrHtml = odrQty > 0 ? '<span style="color:#8b5cf6;font-weight:600;font-variant-numeric:tabular-nums">' + Number(odrQty).toLocaleString('zh-CN') + '</span>' : '<span style="font-variant-numeric:tabular-nums">-</span>';
    html += '<tr style="border-bottom:1px solid #f3f4f6;background:' + bg + '">';
    html += '<td style="padding:7px 8px"><span style="display:inline-block;margin-left:' + indent + 'px"></span><b style="font-variant-numeric:tabular-nums">' + escHtml(r.prd_no||'') + '</b> <span style="font-size:11px;color:var(--sub)">' + escHtml(r.prd_name||'') + '</span></td>';
    html += '<td style="padding:7px 4px;text-align:center"><span style="font-size:10px;font-weight:700;color:#fff;background:' + depthColor + ';padding:2px 5px;border-radius:10px">' + depthLabel + '</span></td>';
    html += '<td style="padding:7px 4px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">' + Number(realDemand).toLocaleString('zh-CN') + '</td>';
    html += '<td style="padding:7px 4px;text-align:right;font-variant-numeric:tabular-nums">' + soRemainHtml + '</td>';
    html += '<td style="padding:7px 4px;text-align:right;color:#16a34a;cursor:' + (!isFg ? 'pointer' : 'default') + ';font-variant-numeric:tabular-nums" ' + (!isFg ? 'onclick="pmcOpenAdjust(\'' + escAttr(r.prd_no||'') + '\',\'\',\'mat\',' + matQty + ')"' : '') + '>' + Number(matQty).toLocaleString('zh-CN') + '</td>';
    html += '<td style="padding:7px 4px;text-align:right;color:#16a34a;font-variant-numeric:tabular-nums" title="\u751f\u4ea7\u4ed3\u4e0d\u53ef调\u6574">' + Number(prodQty).toLocaleString('zh-CN') + '</td>';
    html += '<td style="padding:7px 4px;text-align:right;font-variant-numeric:tabular-nums">' + wayHtml + '</td>';
    html += '<td style="padding:7px 4px;text-align:right;font-variant-numeric:tabular-nums">' + odrHtml + '</td>';
    html += '<td style="padding:7px 4px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">' + Number(totalStock).toLocaleString('zh-CN') + '</td>';
    html += '<td style="padding:7px 4px;text-align:right;min-width:80px">' + gapHtml + '</td>';
    html += '<td style="padding:7px 4px;text-align:center">' + adjBtn + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';

  // 说明
  html += '<div style="margin-top:10px;font-size:11px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap">';
  html += '<span>销未出=<span style="color:#6366f1;font-weight:600">销售未交订单</span></span>';
  html += '<span>在途=<span style="color:#f59e0b;font-weight:600">原材料在途购</span></span>';
  html += '<span>在单请=<span style="color:#8b5cf6;font-weight:600">原材料在单请购</span></span>';
  html += '</div>';

  // 生成 MPS 按钮
  if (fgRow) {
    html += '<div style="margin-top:16px"><button onclick="pmcSubmit()" style="background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer">\u751f成 MPS</button></div>';
  }

  html += '</div>';
  el.innerHTML = html;
}

// PMC 库存调整弹窗（只调原材料仓）
async function pmcOpenAdjust(prdNo, prdName, type, totalQty) {
  // 从 BOM 行数据找 mat_detail
  var bomRows = window.__pmcBomRows || [];
  var row = bomRows.find(function(r) { return r.prd_no === prdNo; });
  var matDetail = (row && row.mat_detail) ? row.mat_detail : [];
  if (!matDetail.length) { alert('\u8be5品号\u65e0\u539f\u6750\u6599\u4ed3\u5e93\u5b58\uff0c\u65e0\u9879调\u6574'); return; }

  var whOpts = matDetail.map(function(m) {
    return '<option value="' + m[0] + '">' + m[0] + ' ' + (m[1]||'') + ' (' + (m[2]||0) + ')</option>';
  }).join('');
  var overlay = document.createElement('div');
  overlay.id = 'pmcAdjOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:490;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = '<div style="background:var(--card);border-radius:16px;width:90%;max-width:400px;padding:20px;font-family:inherit">' +
    '<div style="font-size:16px;font-weight:600;margin-bottom:14px">调\u6574\u5e93\u5b58 <b>' + escHtml(prdNo) + '</b></div>' +
    '<div style="font-size:13px;color:var(--sub);margin-bottom:12px">\u539f\u6750\u6599\u4ed3\u660e\u7ec6</div>' +
    '<div style="margin-bottom:12px">' + matDetail.map(function(m) {
      return '<div style="padding:6px 8px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:12px">' +
        '<b>' + (m[0]||'') + '</b> ' + (m[1]||'') + ': <b>' + (m[2]||0) + '</b></div>';
    }).join('') + '</div>' +
    '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--sub);display:block;margin-bottom:4px">\u76ee\u6807\u4ed3\u5e93</label>' +
    '<select id="pmcAdjWhSelect" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px">' + whOpts + '</select></div>' +
    '<div style="margin-bottom:14px"><label style="font-size:13px;color:var(--sub);display:block;margin-bottom:4px">调\u6574\u540e\u6570\u91cf</label>' +
    '<input id="pmcAdjQtyInput" type="number" step="0.01" min="0" value="' + (matDetail[0] ? matDetail[0][2] : totalQty) + '" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box"></div>' +
    '<div style="display:flex;gap:8px"><button onclick="document.getElementById(\'pmcAdjOverlay\').remove()" style="flex:1;padding:10px;background:#6b7280;color:#fff;border:none;border-radius:6px;cursor:pointer">\u53d6\u6d88</button>' +
    '<button onclick="doPmcAdjust(\'' + escAttr(prdNo) + '\')" style="flex:1;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">\u786e\u8ba4调\u6574</button></div>' +
    '</div>';
  document.body.appendChild(overlay);
}

// PMC 确认调整
async function doPmcAdjust(prdNo) {
  var wh = $id('pmcAdjWhSelect').value;
  var qty = parseFloat($id('pmcAdjQtyInput').value) || 0;
  if (!wh || qty < 0) { alert('\u8bf7\u586b\u5199\u4ed3\u5e93\u548c\u6570\u91cf'); return; }
  try {
    await api(BASE + '/pmc/adjust_stock', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prd_no: prdNo, wh: wh, qty: qty})
    });
    document.getElementById('pmcAdjOverlay').remove();
    // 刷新当前 BOM 树
    var p = window.__pmcPending;
    if (p) { pmcAnalyzeRow(p.soNoItm, p.prdNo, p.qty); }
  } catch(e) { alert('调\u6574\u5931\u8d25: ' + e.message); }
}

// ── 批量调拨弹窗（来自批量升单弹窗）───────────
function openBatchTransferModal() {
  var bomItems = [];
  Object.entries(bomSelectedByProduct).forEach(function(entry) {
    Object.values(entry[1]).forEach(function(r) {
      bomItems.push({prd_no: r.prd_no, qty: r.qty, wh: r.wh, wh_name: r.wh_name});
    });
  });
  var stockItems = stockBatchList.filter(function(i) { return i.direction === 'transfer'; });
  var allItems = bomItems.concat(stockItems);
  if (!allItems.length) { alert('⚠️ 请先勾选 BOM 行或加入升单列表'); return; }
  var n = allItems.length;
  var overlay = document.createElement('div');
  overlay.id = 'bomBatchOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:490;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center';
  overlay.innerHTML = '<div style="background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:960px;padding:14px 16px;font-family:inherit">' +
    '<div style="font-size:16px;font-weight:600;margin-bottom:12px">' + n + ' \u9879调\u6295\u5355\uff0c\u7acb\u5373\u5f00\u59cb\u5f00\u5355\uff01</div>' +
    '<button onclick="document.getElementById(\'bomBatchOverlay\').remove()" style="position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);font-size:18px;cursor:pointer">×</button>' +
    '<button onclick="confirmBatchTransfer()" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">\u786e\u8ba4\u751f成 ' + n + ' \u9879调\u6295\u5355</button></div>';
  document.body.appendChild(overlay);
}
