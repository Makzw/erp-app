<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>安而固 ERP</title>
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --text: #1a1a1a; --sub: #888;
      --accent: #2563eb; --green: #16a34a; --red: #dc2626; --orange: #d97706;
      --border: #e5e7eb; --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--accent); color: #fff;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(37,99,235,.25);
    }
    .topbar h1 { font-size: 17px; font-weight: 600; flex: 1; }
    .tab-bar {
      background: #fff; display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; text-align: center; padding: 10px 16px;
      font-size: 14px; font-weight: 500; color: var(--sub);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .15s; white-space: nowrap;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; border-radius: 9px;
      background: var(--bg); color: var(--sub); font-size: 11px; font-weight: 700;
      margin-left: 4px; padding: 0 4px;
    }
    .tab-btn.active .tab-count { background: var(--accent); color: #fff; }
    .filter-bar {
      background: #fff; padding: 10px 16px;
      display: flex; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .filter-tab {
      flex-shrink: 0; padding: 5px 14px; border-radius: 20px;
      font-size: 13px; border: 1px solid var(--border);
      background: #fff; color: var(--sub); cursor: pointer; transition: all .15s;
    }
    .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pmc-card {
      border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; margin: 6px 12px;
      display: flex; align-items: flex-start; gap: 10px; background: #fff; transition: all .15s;
    }
    .pmc-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .pmc-card-sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .pmc-card-sel:hover { box-shadow: 0 0 0 3px rgba(59,130,246,.25), 0 2px 8px rgba(59,130,246,.1); }
    .state-msg { text-align: center; padding: 48px 16px; color: var(--sub); font-size: 14px; }
    .spinner {
      width: 24px; height: 24px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 24px auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { text-align: center; padding: 16px; color: var(--red); font-size: 14px; }
    .list { padding: 12px 12px 80px; }

    /* ── 请购单卡片 ───────────────────────── */
    .qts-row {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px;
      cursor: pointer; transition: box-shadow .15s;
    }
    .qts-row:active { box-shadow: none; }
    .qts-row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; min-width: 0; }
    .qts-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .qts-status.open { background: #dcfce7; color: #16a34a; }
    .qts-status.closed { background: #f3f4f6; color: #6b7280; }
    .qts-no { font-weight: 700; font-size: 14px; }
    .qts-cus { font-size: 12px; color: var(--accent); font-weight: 500; }
    .qts-date { font-size: 12px; color: var(--sub); }
    .qts-cus-code { font-size: 11px; background: #dbeafe; color: #1d4ed8; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .search-bar {
      background: #fff; padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
    .search-bar input {
      flex: 1; padding: 7px 12px; border: 1px solid var(--border);
      border-radius: 20px; font-size: 14px; outline: none;
      background: var(--bg);
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--sub); }
    .search-clear {
      background: none; border: none; color: var(--sub);
      font-size: 16px; cursor: pointer; padding: 4px; line-height: 1;
      display: none;
    }
    .search-clear.show { display: block; }
    mark { background: #fff176; color: #1a1a1a; border-radius: 2px; padding: 0 1px; }
    .qts-row-body { display: flex; flex-direction: column; gap: 4px; }
    .qts-prd { display: flex; gap: 8px; }
    .qts-pno { font-weight: 600; font-size: 13px; color: var(--text); }
    .qts-pname { font-size: 12px; color: var(--sub); flex: 1; word-break: break-all; }
    .qts-row-foot { display: flex; gap: 12px; font-size: 12px; color: var(--sub); }
    .qts-row-foot b { color: var(--text); }
    .qts-row-meta { display: flex; gap: 12px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; flex-wrap: wrap; }
    .qts-detail-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
    .qts-detail-row { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 8px; }
    .qts-header { padding-bottom: 6px; }
    .qts-no { font-weight: 700; font-size: 15px; }
    .qts-dt { color: var(--sub); font-size: 13px; margin-top: 2px; }
    .qts-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .qts-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .qts-meta { font-size: 12px; color: var(--sub); }
    .qts-meta span { margin-right: 10px; }

    /* ── Section / Group ─────────────────── */
    .smo-section { margin-bottom: 16px; }
    .smo-section-head {
      padding: 8px 14px; border-radius: 8px;
      font-weight: 700; font-size: 14px; margin-bottom: 4px;
      background: #fff; color: var(--text);
      border-bottom: 2px solid var(--accent);
    }
    .smo-sub-section { margin-bottom: 4px; }
    .smo-sub-head {
      padding: 4px 8px; font-size: 13px; font-weight: 600;
      color: var(--sub); border-left: 3px solid;
      margin: 4px 0;
    }

    /* ── SMO Card ─────────────────────────── */
    .smo-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px;
      margin-bottom: 10px; position: relative;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .15s, box-shadow .15s;
      min-width: 0; /* 防止 flex 子项横向溢出 */
    }
    .smo-card.selected {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(220,38,38,.15);
    }
    .smo-card.unclickable {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .smo-card.transferred {
      cursor: not-allowed;
      opacity: 0.65;
    }
    .smo-card.dispatch-ready {
      /* 默认无边框，选中后才有绿色边框 */
    }
    .smo-card.selected {
      border-color: var(--green) !important;
      box-shadow: 0 0 0 3px rgba(34,197,94,.2);
    }
    .smo-card-header { padding-bottom: 6px; }
    .dispatch-mat-list { background: var(--bg); border-radius: 8px; overflow: hidden; }
    .smo-fg { font-weight: 700; font-size: 15px; word-break: break-all; }
    .smo-fg-name { color: var(--sub); font-size: 13px; margin-top: 2px; word-break: break-all; }
    .smo-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .smo-bom-rows { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
    .smo-bom-row { padding: 4px 0; min-width: 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .smo-bom-row-prd { font-weight: 600; font-size: 13px; word-break: break-all; flex: 0 0 auto; }
    .smo-bom-row-name { color: var(--sub); font-size: 12px; flex: 1 1 auto; min-width: 0; word-break: break-all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .smo-bom-row-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .smo-bom-row .ok { color: var(--green); font-size: 12px; }
    .smo-bom-row .part { color: var(--orange); font-size: 12px; }
    .smo-bom-row .no { color: var(--red); font-size: 12px; }
    .smo-bom-row-wh { color: var(--sub); font-size: 11px; }
    .smo-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
    .smo-qty-row { font-size: 12px; color: var(--text); white-space: nowrap; }
    .smo-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--sub); flex: 1; min-width: 0; }
    .smo-meta span { word-break: break-all; min-width: 0; }
    .stock { font-size: 12px; }
    .ready-box { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 14px; font-size: 12px; font-weight: 600; }
    .ready-box.ok { background: #dcfce7; color: var(--green); }
    .ready-box.no { background: #fee2e2; color: var(--red); }
    .ready-box.warn { background: #fef3c7; color: var(--orange); }

    /* ── 盘点仓库卡片 ─────────────────────────── */
    .stock-wh-head { font-size: 12px; color: var(--sub); padding: 4px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    .stock-wh-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px;
      cursor: pointer; transition: box-shadow .15s;
    }
    .stock-wh-card:active { box-shadow: none; }
    .stock-wh-card.stock-wh-new {
      border: 2px dashed var(--border); background: #fafafa;
      color: var(--sub);
    }
    .stock-wh-icon { font-size: 24px; line-height: 1; flex-shrink: 0; width: 36px; text-align: center; }
    .stock-wh-info { flex: 1; min-width: 0; }
    .stock-wh-name { font-weight: 600; font-size: 14px; color: var(--text); }
    .stock-wh-qty { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .stock-wh-arrow { font-size: 20px; color: var(--sub); flex-shrink: 0; }

    /* ── Checkbox (hidden) ───────────────────── */
    .smo-check-wrap { display: none; }

    /* ── FAB (floating +) ────────────────── */
    .fab {
      position: fixed; bottom: 28px; right: 24px; z-index: 200;
      width: 52px; height: 52px; border-radius: 26px;
      background: var(--green); color: #fff;
      font-size: 32px; font-weight: 300; line-height: 52px; text-align: center;
      box-shadow: 0 4px 16px rgba(22,163,74,.4);
      cursor: pointer; display: none;
      transition: transform .15s, box-shadow .15s;
    }
    .fab.show { display: block; }
    .fab:active { transform: scale(.93); }

    /* ── Modal ────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.5);
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 600px; max-height: 88vh;
      display: flex; flex-direction: column;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } }
    .modal-head {
      padding: 16px 16px 0;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .modal-head h2 { font-size: 16px; font-weight: 600; flex: 1; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg); font-size: 18px; cursor: pointer; color: var(--sub);
    }
    .modal-tabs {
      display: flex; padding: 12px 16px 0; gap: 8px; flex-shrink: 0;
    }
    .modal-tab {
      flex: 1; padding: 8px 0; text-align: center; font-size: 14px;
      border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 500;
      border: 1px solid var(--border); border-bottom: none;
      color: var(--sub); background: var(--bg);
    }
    .modal-tab.active { background: var(--card); color: var(--text); }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 12px 16px 16px;
    }

    /* ── Issue rows ──────────────────────── */
    .issue-row {
      background: var(--bg); border-radius: 10px; padding: 12px;
      margin-bottom: 8px;
    }
    .issue-row-top {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .issue-prd { font-weight: 700; font-size: 14px; flex: 1; }
    .issue-name { font-size: 12px; color: var(--sub); }
    .issue-stock { font-size: 11px; color: var(--sub); }
    .issue-stock span { margin-right: 8px; }
    .issue-stock .shortage { color: var(--red); font-weight: 600; }
    .issue-stock .enough { color: var(--green); font-weight: 600; }
    .issue-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
    .issue-field label { font-size: 11px; color: var(--sub); display: block; margin-bottom: 3px; }
    .issue-field input, .issue-field select {
      width: 100%; padding: 6px 8px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
    }
    .issue-field input[type="number"] { text-align: right; }
    .issue-type-tag {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      font-weight: 600;
    }
    .issue-type-tag.prod { background: #dbeafe; color: #1d4ed8; }
    .issue-type-tag.sub { background: #fef3c7; color: #92400e; }

    /* ── Modal footer ────────────────────── */
    .modal-footer {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; flex-shrink: 0;
    }
    .btn-confirm {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      background: var(--green); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .btn-confirm:active { opacity: .85; }
    .btn-cancel {
      padding: 12px 20px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text); font-size: 15px; cursor: pointer;
    }

    /* ── Toast ───────────────────────────── */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.8); color: #fff; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; z-index: 400;
      display: none; white-space: nowrap;
    }
    .toast.show { display: block; animation: fadeIn .2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
    /* 采购未回 工具栏+分页 */
    .pos-un-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 4px; font-size: 13px; gap: 8px; }
    .pos-un-toolbar select { padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; }
    .pos-un-info { color: var(--sub); font-size: 12px; }
    .pos-un-filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pos-un-filter-row label { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 3px; }
    .pos-un-filter-row input { padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border); font-size: 12px; width: 80px; }
    .pos-un-filter-reset { font-size: 12px; color: var(--accent); cursor: pointer; border: none; background: none; padding: 2px 4px; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 4px; }
    .pager button { padding: 6px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; }
    .pager button:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }
    .pager span { font-size: 13px; color: var(--sub); }

    /* ── 待升单列表：FAB + 侧边栏 ─────────────── */
    .stock-batch-fab {
      position: fixed; right: 16px; bottom: 24px; z-index: 500;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #fff; border: none;
      font-size: 26px; cursor: pointer; box-shadow: 0 4px 14px rgba(37,99,235,.4);
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; transition: transform .15s;
    }
    .stock-batch-fab:active { transform: scale(.95); }
    .stock-batch-fab-badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 22px; height: 22px; padding: 0 6px;
      background: var(--red); color: #fff; border-radius: 11px;
      font-size: 12px; font-weight: 700; line-height: 22px;
      text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .stock-batch-overlay {
      display: none;
    }
    .stock-batch-overlay.show { display: block; }
    .stock-batch-side {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 470;
      width: 100%; max-width: 380px;
      background: var(--card); box-shadow: -4px 0 16px rgba(0,0,0,.12);
      transform: translateX(100%); transition: transform .25s ease;
      display: flex; flex-direction: column;
      font-family: inherit;
    }
    .stock-batch-side.show { transform: translateX(0); }
    .stock-batch-head {
      padding: 14px 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .stock-batch-head .title { font-size: 15px; font-weight: 700; flex: 1; color: var(--text); }
    .stock-batch-head .count {
      background: var(--accent); color: #fff;
      padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 700;
    }
    .stock-batch-head .close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg); font-size: 18px; cursor: pointer; color: var(--sub);
    }
    .stock-batch-body { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .stock-batch-empty {
      padding: 60px 16px; text-align: center; color: var(--sub); font-size: 13px;
    }
    .batch-row {
      background: var(--bg); border-radius: 10px; padding: 10px;
      margin-bottom: 8px; border: 1px solid var(--border);
    }
    .batch-row-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .batch-row-dir {
      font-size: 11px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; flex-shrink: 0;
    }
    .batch-row-dir.out { background: #fee2e2; color: var(--red); }
    .batch-row-dir.in  { background: #dcfce7; color: var(--green); }
    .batch-row-prd {
      flex: 1; font-size: 13px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .batch-row-del {
      width: 26px; height: 26px; border-radius: 50%; border: none;
      background: var(--card); color: var(--sub); cursor: pointer;
      font-size: 14px; line-height: 1; flex-shrink: 0;
    }
    .batch-row-meta {
      font-size: 12px; color: var(--sub); margin-bottom: 8px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .batch-row-meta b { color: var(--text); font-weight: 600; }
    .batch-row-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .batch-row-grid label {
      display: block; font-size: 10px; color: var(--sub);
      margin-bottom: 2px; font-weight: 600;
    }
    .batch-row-grid input {
      width: 100%; box-sizing: border-box;
      padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 12px;
      font-family: inherit; outline: none; background: var(--card);
    }
    .stock-batch-foot {
      padding: 12px; border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      flex-shrink: 0; background: var(--card);
    }
    .stock-batch-foot .btn-clear {
      grid-column: span 2; padding: 8px;
      background: var(--card); color: var(--sub);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .stock-batch-foot .btn-clear:disabled {
      opacity: .4; cursor: not-allowed;
    }
    .stock-batch-foot .btn-up {
      padding: 12px 8px; border-radius: 10px;
      border: 1.5px solid; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .stock-batch-foot .btn-up:disabled { opacity: .4; cursor: not-allowed; }
    .stock-batch-foot .btn-up-out {
      background: #fee2e2; color: var(--red); border-color: #fca5a5;
    }
    .stock-batch-foot .btn-up-in {
      background: #dcfce7; color: var(--green); border-color: #86efac;

</head>

<!-- FAB -->

    </div>

      <button class="btn-confirm" id="btnMmConfirm" onclick="confirmMm()">确认入库</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const BASE = '/api';
let curTab = 'qts';
let curFilter = 'pending';
let selected = new Set(); // ref_itm (MO_NO) keys
let rawData = []; // 存储原始数据供搜索过滤
let curSearch = ''; // 当前搜索词

// ── Utils ───────────────────────────────────────────────────────────────────
function api(url, opts) {
  return fetch(url, opts).then(r => r.json());
}
function fmt(v) { return v == null || v === '' ? '' : String(v); }
// 适合 HTML data-attribute 里 JSON 的转义（处理 HTMLEncode 后仍然残留的问题）
function htmlJsonEscape(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


function escAttr(v) { return v.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escHtml(v) { return v == null ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtNum(v) { return v == null ? '' : Number(v).toLocaleString('zh-CN'); }
function fmtDate(v) {
  if (!v) return '';
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleDateString('zh-CN');
}
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
function $id(id) { return document.getElementById(id); }

// ── Search ─────────────────────────────────────────────────────────────────
function highlight(s, q) {
  if (!q || !s) return fmt(s);
  return fmt(s).replace(new RegExp(escapeRegex(q), 'gi'), m => `<mark>${m}</mark>`);
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function handleSearch(v) {
  const q = v.trim();
  curSearch = q;
  $id('searchClear').classList.toggle('show', q.length > 0);

  switch (curTab) {
    case 'pos-unreceived':
      loadPosUnreceived(q); break;
    case 'qts':
      if (!q) { renderQts(rawData, ''); break; }
      renderQts(rawData.filter(r => JSON.stringify(r).toLowerCase().includes(q.toLowerCase())), q); break;
    case 'smo':
      if (!q) { loadSmo(); break; }
      loadStockSuggestions(q); break;
    case 'stock':
      if (!q) { loadStock(); break; }
      loadStockSuggestions(q); break;
    case 'smo-mm':
      curMmSearch = q;
      if (!q) { renderDispatch(dispatchData, q); break; }
      renderDispatch(dispatchData.filter(r => JSON.stringify(r).toLowerCase().includes(q.toLowerCase())), q); break;
    case 'completion':
      if (!q) { loadCompletion(); break; }
      if (!completionData.length) { loadCompletion(); break; }
      renderCompletionListFiltered(completionData.filter(r => JSON.stringify(r).toLowerCase().includes(q.toLowerCase()))); break;
    case 'pmc':
      (async () => {
        try {
          const data = await api(BASE + '/pmc/pos_unanalyzed?' + new URLSearchParams({q: q||''}));
          renderPMCList(data.items || [], q||'');
        } catch(e) { renderPMCList([], q||''); }
      })();
      break;
  }
}

function clearSearch() {
  $id('searchInput').value = '';
  $id('searchClear').classList.remove('show');
  curSearch = '';
  handleSearch('');
}

function renderCurrentTab() {
  if (curTab === 'qts') renderQts(rawData, '');
  else if (curTab === 'pos-unreceived') loadPosUnreceived();
  else if (curTab === 'completion') loadCompletion();
  else if (curTab === 'smo-mm') renderDispatch(dispatchData, '');
  else if (curTab === 'pmc') loadPMC();
}

function renderFiltered(items, q) {
  switch (curTab) {
    case 'qts':   renderQts(items, q); break;
    case 'smo-mm': renderDispatch(dispatchData, q); break;
  }
}

// ── Tab / Filter ────────────────────────────────────────────────────────────
// Main tab bar only (not smoTabBar)
const mainTabBar = document.querySelector('.tab-bar');
mainTabBar.addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    mainTabBar.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');

    if (btn.dataset.tab) {
      // Main tab
      curTab = btn.dataset.tab;
      $id('smoTabBar').style.display = 'none';
      // 切换时清除盘点tab的autocomplete残留
      if (typeof dismissSuggestions === 'function') dismissSuggestions();
      stockSuggestions = [];
      $id('searchBar').style.display = 'flex';
      $id('searchInput').value = '';
      $id('searchClear').classList.remove('show');
      curSearch = '';
      // FAB 只在完工单(smo-mm)tab显示
      $id('fabIssue').style.display = 'none';
      if (curTab === 'pos-unreceived') {
        posUnSearch = ''; posUnQ = '';
        posUnCustomer = ''; posUnSupplier = ''; posUnOrderNo = '';
      }
      else if (curTab === 'smo-mm') curMmSearch = '';
      if (curTab === 'smo') {
        loadSmo();
      } else if (curTab === 'pos-unreceived') {
        loadPosUnreceived();
      } else if (curTab === 'smo-mm') {
        loadSmoMm();
      } else if (curTab === 'stock') {
        loadStock();
      } else if (curTab === 'transfer') {
        loadTransfer();
      } else if (curTab === 'completion') {
        loadCompletion();
      } else if (curTab === 'pmc') {
        loadPMC();
      } else {
        loadQts();
      }
    }
  });

// ── 请购单 ──────────────────────────────────────────────────────────────────
let qtsSupplier = '', qtsOrderNo = '';

async function loadQts() {
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>加载中…</div>';
  try {
    const params = new URLSearchParams({});
    if (qtsSupplier) params.set('supplier', qtsSupplier);
    if (qtsOrderNo)  params.set('order_no',  qtsOrderNo);
    const data = await api(BASE + '/qts?' + params);
    rawData = data.items || [];
    renderQts(rawData, '');
  } catch(e) { el.innerHTML = '<div class="error-msg">'+e.message+'</div>'; }
}

function applyQtsFilters() {
  qtsSupplier = ($id('qtsFSupplier') || {value:''}).value.trim();
  qtsOrderNo  = ($id('qtsFOrderNo')  || {value:''}).value.trim();
  loadQts();
}

function resetQtsFilters() {
  qtsSupplier = ''; qtsOrderNo = '';
  loadQts();
}

function renderQts(items, q) {
  const el = $id('content');
  const toolbar = `
<div class="pos-un-toolbar" style="padding:8px 12px">
  <span class="pos-un-filter-row">
    <label>供应商<input type="text" id="qtsFSupplier" value="${escAttr(qtsSupplier)}" placeholder="筛选" autocomplete="off" onkeydown="if(event.key==='Enter')applyQtsFilters()"></label>
    <label>指令单<input type="text" id="qtsFOrderNo" value="${escAttr(qtsOrderNo)}" placeholder="筛选" autocomplete="off" onkeydown="if(event.key==='Enter')applyQtsFilters()"></label>
    <button class="pos-un-filter-reset" onclick="resetQtsFilters()">清除</button>
    <button onclick="applyQtsFilters()">筛选</button>
  </span>
  <span class="pos-un-info">${items.length} 条</span>
</div>`;
  if (!items || !items.length) { el.innerHTML=toolbar+'<div class="state-msg">暂无请购单</div>'; return; }
  let h = toolbar + '<div class="list">';
  for (const r of items) {
    const closed = r.cls_id;
    h += `<div class="qts-row">
      <div class="qts-row-head">
        <span class="qts-status ${closed?'closed':'open'}">${closed?'已结':'未结'}</span>
        <span class="qts-no">${highlight(r.qt_no, q)}</span>
        <span class="qts-date">${highlight(r.qt_dd, q)}</span>
      </div>
      <div class="qts-row-body">
        <div class="qts-prd">
          <span class="qts-pno">${highlight(r.prd_no, q)}</span>
          <span class="qts-pname">${highlight(r.prd_name, q)||'—'}</span>
        </div>
        <div class="qts-row-foot">
          <span>数量: <b>${r.qty} ${fmt(r.ut)}</b></span>
          <span>上次单价: <b class="price-val" style="display:none">${r.last_up ? '¥'+Number(r.last_up).toFixed(4) : '—'}</b><span class="price-lock-icon">🔒</span></span>
        </div>
      </div>
      <div class="qts-row-meta">
        <span>交期: ${highlight(r.est_dd, q)||'—'}</span>
        <span>指令单: ${highlight(r.order_no, q)||'—'}</span>
        <span>供应商: ${highlight(r.supplier, q)||'—'}</span>
      </div>
    </div>`;
  }
  el.innerHTML = h + '</div>';
}

// ── 采购未回 ─────────────────────────────────────────────────────────────────
let posUnTotal = 0;
let posUnQ = '', posUnCustomer = '', posUnSupplier = '', posUnOrderNo = '';

async function loadPosUnreceived(q) {
  posUnQ = (q !== undefined ? q : '').trim();
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>加载中…</div>';
  try {
    const params = new URLSearchParams({});
    const search = (q !== undefined ? q : '').trim();
    if (search) params.set('q', search);
    if (posUnCustomer) params.set('customer', posUnCustomer);
    if (posUnSupplier) params.set('supplier', posUnSupplier);
    if (posUnOrderNo) params.set('order_no', posUnOrderNo);
    const data = await api(BASE + '/pos-unreceived?' + params);
    const items = data.items || [];
    posUnTotal = data.total || 0;
    renderPosUnreceived(items, posUnQ);
  } catch(e) { el.innerHTML = '<div class="error-msg">'+e.message+'</div>'; }
}

function renderPosUnreceived(items) {
  const el = $id('content');
  const q = posUnQ;
  const qC = posUnCustomer;
  const qS = posUnSupplier;
  const qO = posUnOrderNo;
  const anyQ = q || qC || qS || qO;

  let h = `
    <div class="pos-un-toolbar">
      <span class="pos-un-filter-row">
        <label>客户<input type="text" id="posUnFCustomer" value="${escAttr(posUnCustomer)}" placeholder="筛选" autocomplete="off" onkeydown="if(event.key==='Enter')applyPosUnFilters()"></label>
        <label>供应商<input type="text" id="posUnFSupplier" value="${escAttr(posUnSupplier)}" placeholder="筛选" autocomplete="off" onkeydown="if(event.key==='Enter')applyPosUnFilters()"></label>
        <label>指令单<input type="text" id="posUnFOrderNo" value="${escAttr(posUnOrderNo)}" placeholder="筛选" autocomplete="off" onkeydown="if(event.key==='Enter')applyPosUnFilters()"></label>
        <button class="pos-un-filter-reset" onclick="resetPosUnFilters()">清除</button>
        <button onclick="applyPosUnFilters()">筛选</button>
      </span>
      <span class="pos-un-info">${posUnTotal} 条</span>
    </div>`;

  if (!items.length) {
    el.innerHTML = h + '<div class="state-msg">暂无采购未回</div>';
    return;
  }

  h += '<div class="list">';
  for (const r of items) {
    h += `<div class="qts-row">
      <div class="qts-row-head">
        <span class="qts-status open">未入库</span>
        <span class="qts-no">${highlight(fmt(r.os_no), q)}</span>
        <span class="qts-date">${fmt(r.os_dd)}</span>
        ${r.customer ? `<span class="qts-cus">${highlight(r.customer, qC || q)}</span>` : ''}
      </div>
      <div class="qts-row-body">
        <div class="qts-prd">
          <span class="qts-pno">${highlight(fmt(r.prd_no), q)}</span>
          <span class="qts-pname">${highlight(fmt(r.prd_name)||'—', q)}</span>
        </div>
        <div class="qts-row-foot">
          <span>未回: <b>${r.unreceived} ${fmt(r.ut)}</b></span>
          <span style="color:var(--sub)">订单: ${r.qty}</span>
        </div>
      </div>
      <div class="qts-row-meta">
        <span>交期: ${fmt(r.est_dd)||'—'}</span>
        <span>指令单: ${highlight(fmt(r.order_no)||'—', qO)}</span>
        ${r.supplier ? `<span>供应商: ${highlight(r.supplier, qS || q)}</span>` : ''}
      </div>
    </div>`;
  }
  h += '</div>';
  el.innerHTML = h;
}

function applyPosUnFilters() {
  posUnCustomer = ($id('posUnFCustomer') || {value:''}).value.trim();
  posUnSupplier = ($id('posUnFSupplier') || {value:''}).value.trim();
  posUnOrderNo  = ($id('posUnFOrderNo')  || {value:''}).value.trim();
  loadPosUnreceived();
}

function resetPosUnFilters() {
  posUnQ = ''; posUnCustomer = ''; posUnSupplier = ''; posUnOrderNo = '';
  const elC = $id('posUnFCustomer'), elS = $id('posUnFSupplier'), elO = $id('posUnFOrderNo');
  if (elC) elC.value = '';
  if (elS) elS.value = '';
  if (elO) elO.value = '';
  loadPosUnreceived();
}

async function showQtDetail(qt_no) {
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div></div>';
  try {
    const d = await api(BASE + '/qts/' + encodeURIComponent(qt_no));
    if (d.error) { el.innerHTML='<div class="error-msg">'+d.error+'</div>'; return; }
    let h = `<div class="list">
      <div class="qts-detail-card">
        <div class="qts-header">
          <div class="qts-no">${fmt(d.qt_no)}</div>
          <div class="qts-dt">${fmt(d.qt_dd)} ${d.cls_id?'<span class="qts-status closed">已结案</span>':'<span class="qts-status open">未结案</span>'}</div>
        </div>
        <div class="qts-divider"></div>
        <dl class="detail-info" style="font-size:13px;line-height:1.8">
          <dt>制单人</dt><dd>${fmt(d.usr)||'—'}</dd>
          <dt>审核人</dt><dd>${fmt(d.chk_man)||'—'}</dd>
          <dt>供应商</dt><dd>${fmt(d.cus_name)||'—'}</dd>
          <dt>备注</dt><dd>${fmt(d.rem)||'—'}</dd>
        </dl>
      </div>
      <h3 style="font-size:13px;color:var(--sub);padding:8px 0">明细行（${(d.items||[]).length} 条）</h3>`;
    for (const item of d.items||[]) {
      h += `<div class="qts-detail-row">
        <div class="qts-header">
          <div class="qts-no">${fmt(item.prd_no)}</div>
          <div class="qts-dt">${fmt(item.prd_name)||'—'}</div>
        </div>
        <div class="qts-footer">
          <div class="qts-meta">
            <span>¥${Number(item.up||0).toFixed(2)} × ${fmtNum(item.qty)}${fmt(item.ut)}</span>
            <span>= ¥${Number(item.amt||0).toLocaleString('zh-CN',{minimumFractionDigits:2})}</span>
            ${item.est_dd?'<span>交期 '+fmtDate(item.est_dd)+'</span>':''}
          </div>
        </div>
      </div>`;
    }
    el.innerHTML = h + '</div><div style="padding:16px"><button class="btn-cancel" onclick="loadQts()">← 返回</button></div>';
  } catch(e) { el.innerHTML = '<div class="error-msg">'+e.message+'</div>'; }
}

// ── 派工单 SMO ─────────────────────────────────────────────────────────────
let smoFullData = []; // SMO tab 新版不使用（派工单发料改到其他Tab）
async function loadSmo() {
  const el = $id('content');
  el.innerHTML = `
    <div class="list">
      <div style="padding:4px 0 8px">
        <div style="font-size:13px;color:var(--sub);margin-bottom:6px">输入品号或品名搜索（支持下拉选择）</div>
      </div>
    </div>`;
  // 清空全局搜索框
  const inp = $id('searchInput');
  if (inp) inp.value = '';
  $id('searchClear')?.classList.remove('show');
  curSearch = '';
  // 只接管回车键（点击建议/按回车 → 调 BOM 接口）
  if (inp) {
    inp.onkeydown = function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = inp.value.trim();
        if (stockSuggestions.length > 0) {
          const first = stockSuggestions[0];
          inp.value = first.prd_no;
          dismissSuggestions();
          smoSearchByPRD(first.prd_no);
        } else if (val) {
          smoSearchByPRD(val);
        }
      }
    };
  }
}

async function smoSearchByPRD(prdNo) {
  dismissSuggestions();
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>搜索中…</div>';
  try {
    const d = await api(BASE + '/smo/bom_stock?' + new URLSearchParams({fg_no: prdNo}));
    if (!d.items || !d.items.length) {
      el.innerHTML = `<div class="list">
        <div style="padding:16px;text-align:center;color:var(--orange);font-size:14px">
          ⚠️ 品号 <b>${fmt(prdNo)}</b> 无 BOM 子件
        </div>
      </div>`;
      return;
    }
    renderBomStock(d);
  } catch(e) {
    el.innerHTML = '<div class="error-msg">'+e.message+'</div>';
  }
}

function renderBomStock(d) {
  const el = $id('content');
  const summary = `
    <div class="smo-card" style="background:var(--bg2);margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <b style="font-size:15px">${fmt(d.fg_no)}</b>
        <span style="font-size:12px;color:var(--sub)">${fmt(d.fg_name||'').substring(0,40)}</span>
      </div>
      <div style="font-size:12px;color:var(--sub)">
        ${d.node_count} 节点 · 最深 D${d.max_depth} ·
        <span style="color:${d.ready_count===d.node_count?'var(--green)':'var(--orange)'}">
          ${d.ready_count} 齐料 · ${d.shortage_count} 缺料
        </span>
      </div>
    </div>`;

  // 渲染嵌套树节点（递归）
  function renderNode(node, depth) {
    const isLeaf  = node.is_leaf;
    const stock  = node.stock;
    const short  = node.shortage;
    const qty    = node.qty_per_unit;
    const name   = (node.prd_name || '').trim();
    const children = node.children || [];

    let statusIcon, statusColor, stockLabel;
    if (isLeaf) {
      if (stock === null || stock === undefined || stock === 0) {
        statusIcon = '❌'; statusColor = 'var(--orange)';
        stockLabel = short > 0 ? `缺 ${short}` : '无库存';
      } else {
        statusIcon = '✅'; statusColor = 'var(--green)';
        stockLabel = stock.toLocaleString();
      }
    } else {
      statusIcon = children.length ? '▶' : '·';
      statusColor = 'var(--sub)';
      stockLabel = '';
    }

    // 颜色：按层级渐变，越深越暖
    const depthColors = [
      '#4A90D9', // D0 成品 蓝
      '#6B8E6B', // D1 深绿
      '#4CAF50', // D2 绿
      '#E8A838', // D3 黄橙
      '#F4A261', // D4 橙
      '#E76F51', // D5 红
    ];
    const badgeColor = depthColors[Math.min(depth, depthColors.length - 1)];
    const kndLabel   = node.knd == '4'
      ? '<span style="font-size:10px;color:var(--sub);background:var(--bg2);padding:1px 5px;border-radius:3px">原料</span>'
      : '';
    const depthBadge = `<span style="font-size:10px;color:#fff;background:${badgeColor};padding:1px 5px;border-radius:3px;min-width:20px;text-align:center;display:inline-block">D${depth}</span>`;

    const hasChildren = children.length > 0;
    const toggleClass = hasChildren ? 'tree-toggle' : '';
    const toggleIcon  = hasChildren ? '<span class="tree-caret">▶</span>' : '<span style="display:inline-block;width:14px"></span>';

    const indent = depth * 16;

    let html = `
      <div class="tree-node" data-prd="${node.prd_no}" style="margin-bottom:2px">
        <div style="display:flex;align-items:${isLeaf?'center':'flex-start'};gap:6px;padding:6px 12px 6px ${12+indent}px;cursor:pointer;border-radius:6px"
             class="${toggleClass}"
             onclick="stockSearchByPRD('${node.prd_no}')">
          ${toggleIcon}
          ${depthBadge}
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-size:13px;font-weight:500;color:var(--text)">${fmt(node.prd_no)}</span>
              ${kndLabel}
              <span style="font-size:10px;color:var(--sub)">×${qty}</span>
            </div>
            ${name ? `<div style="font-size:11px;color:var(--sub);margin-top:2px;word-break:break-all;white-space:normal">${fmt(name)}</div>` : ''}
          </div>
          ${isLeaf ? `<span style="font-size:13px;font-weight:700;color:${statusColor};white-space:nowrap;margin-left:8px">${statusIcon} ${stockLabel}</span>` : ''}
        </div>
        <div class="tree-children" style="display:none;margin-top:2px">`;
    for (const c of children) {
      html += renderNode(c, depth + 1);
    }
    html += `</div>
      </div>`;
    return html;
  }

  const tree = d.nested_tree || {};
  const treeHtml = tree.prd_no ? renderNode(tree, 0) : '<div style="padding:16px;text-align:center;color:var(--sub)">无 BOM 数据</div>';

  const html = `
    <div class="list">
      ${summary}
      <div class="smo-card" style="padding:8px 12px;margin-bottom:8px">
        <div style="font-size:12px;color:var(--sub);margin-bottom:4px">
          节点说明：<span style="color:var(--green)">✅</span>=有库存 &nbsp;
          <span style="color:var(--orange)">❌</span>=缺货 &nbsp;
          <span style="color:var(--sub)">▶</span>=点击展开 &nbsp;
          D0=成品 &nbsp; D3-D5=原料
        </div>
      </div>
      ${treeHtml}
      <div style="padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-cancel" onclick="expandAllTree()">📂 展开全部</button>
        <button class="btn-cancel" onclick="collapseAllTree()">📁 收起全部</button>
        <button class="btn-cancel" onclick="clearSearch()">← 清除搜索</button>
      </div>
    </div>`;

  el.innerHTML = html;
}

// 折叠/展开树节点
function treeToggle(el) {
  const children = el.nextElementSibling;
  if (!children) return;
  const isHidden = children.style.display === 'none';
  children.style.display = isHidden ? '' : 'none';
  const caret = el.querySelector('.tree-caret');
  if (caret) caret.textContent = isHidden ? '▼' : '▶';
}

// 一键展开/收起全部 BOM 树
function expandAllTree() {
  document.querySelectorAll('.tree-children').forEach(el => el.style.display = '');
  document.querySelectorAll('.tree-caret').forEach(el => el.textContent = '▼');
}

function collapseAllTree() {
  document.querySelectorAll('.tree-children').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.tree-caret').forEach(el => el.textContent = '▶');
}

async function confirmIssue() {
  const rows = issueRows.filter(r => curIssueTab === 'prod' ? r.is_prod : !r.is_prod);
  const payload = rows.map((r, idx) => {
    const qty = parseFloat($id('iqty_' + idx)?.value || 0);
    const wh1 = $id('iwh1_' + idx)?.value || '';
    const wh2 = $id('iwh2_' + idx)?.value || '';
    // wh1/wh2 需要转换：文本 → 仓库代码（MY_WH.NAME → MY_WH.WH）
    return {
      smo_no: r.smo_no,
      itm: r.itm,
      ref_itm: r.ref_itm,
      mot_itm: r.mot_itm,
      mo_id: !r.is_prod,   // false=生产领料, true=外发加工
      prd_no: r.prd_no,
      prd_name: r.name || '',
      qty: qty,
      wh1: wh1,
      wh2: wh2,
      cus_no: r.cus_no || '',
      order_no: r.order_no,
      so_no_itm: r.so_no_itm,
    };
  }).filter(r => r.qty > 0);

  if (!payload.length) {
    toast('请输入发料数量');
    return;
  }

  $id('btnConfirm').disabled = true;
  $id('btnConfirm').textContent = '提交中…';
  try {
    const d = await api(BASE + '/smo/issue', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    if (d.ok) {
      const tfNos = d.transfers.map(t => t.ic_no).join(', ');
      toast('✅ 发料成功！调拨单: ' + tfNos);
      closeIssueModal();
      selected.clear();
      loadSmo();
    } else {
      toast('❌ 失败: ' + JSON.stringify(d));
    }
  } catch(e) {
    toast('❌ 提交失败: ' + e.message);
  } finally {
    $id('btnConfirm').disabled = false;
    $id('btnConfirm').textContent = '确认发料';
  }
}

function applyCompFilters() {
  compCustomer = ($id('compFCustomer') || {value:''}).value.trim();

  compDdjhPlan = ($id('compFDdjhPlan') || {value:''}).value.trim();

    if (compWh && (d.wh1_name||d.wh1||'') !== compWh) return false;
    return true;

  renderCompletionList();

  compCustomer = ''; compDdjh = ''; compDdjhPlan = ''; compWh = '';

  // 批量查每个成品的材料详情

          <div style="font-size:13px;font-weight:600">点击成品加入完工列表</div>
        </div>
        <button onclick="document.getElementById('cmOverlay').remove()" style="width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);font-size:16px;cursor:pointer">×</button>
      </div>
      <div id="cmFgList" style="flex:1;overflow-y:auto;padding:10px 12px"></div>
    </div>
    <style>@keyframes slideUp{from{transform:translateY(100%)}}</style>`;
  document.body.appendChild(overlay);

          <span style="font-size:10px;color:var(--sub)">件</span>

// 加入完工列表：查 BOM materials + 调拨单字段，再暂存
async function completionAddFgDetail(fgNo, icNo, qtyInputId) {
  if (completionList.some(x => x.fg_no === fgNo)) { toast('\u26a0\ufe0f \u5df2\u6dfb\u52a0'); return; }
  const fgQty = parseInt(document.getElementById(qtyInputId)?.value) || 1;
  // 从调拨单获取指令单号/客户/单重/净重
  const tRec = completionData.find(x => x.ic_no === icNo) || {};
  const ref = tRec.ref || '';
  const customer = tRec.cus || '';
  const ddjh = tRec.ddjh || '';
  const danzhong = tRec.danzhong || 0;
  const jingzhong = tRec.jingzhong || 0;
  let bomData;
  try {
    bomData = await api(BASE + '/completion/fg_detail?' + new URLSearchParams({fg_no: fgNo}));
  } catch(e) { toast('\u274c \u52a0\u8f7d BOM \u5931\u8d25'); return; }
  const materials = (bomData.materials||[]).map(m => ({
    prd_no: m.prd_no,
    prd_name: m.prd_name||'',
    qty_per_unit: m.ratio || 0,
    transfers: m.transfers||[],
  }));
  const whs = [...new Set(materials.flatMap(m => (m.transfers||[]).map(t => t.wh1_name||t.wh1||'')).filter(Boolean))];
  const fg_wh = whs[0] || 'G';
  completionList.push({
    fg_no: fgNo,
    fg_name: bomData.fg_name||'',
    fg_qty: fgQty,
    fg_wh,
    transfer_ic_no: icNo,
    ref,
    customer,
    ddjh,
    danzhong,
    jingzhong,
    bom: materials,
  });
  document.getElementById('cmOverlay')?.remove();
  renderCompletionList();
}
// 实时重算弹窗内某项成品的 BOM 需用量
function bomRecalc(idx) {
  const qty = parseInt(document.getElementById('clQ_' + idx)?.value) || 1;
  completionList[idx].fg_qty = qty;
  const item = completionList[idx];
  const wh = item.fg_wh || 'G';
  // Update each BOM sub-row need/ok cell
  document.querySelectorAll('[data-item-idx="' + idx + '"]').forEach(row => {
    const prdNo = row.getAttribute('data-prd');
    const m = item.bom?.find(x => x.prd_no === prdNo);
    if (!m) return;
    const ratio = m.qty_per_unit || 0;
    const need = Math.ceil(ratio * qty);
    const tRow = (m.transfers||[]).find(t => (t.wh1_name||t.wh1||'') === wh);
    const avail = tRow ? (tRow.available || 0) : 0;
    const ok = avail >= need;
    const needCell = row.querySelector('.bom-need');
    const okCell = row.querySelector('.bom-ok');
    if (needCell) needCell.textContent = need;
    if (okCell) {
      okCell.textContent = ok ? '\u2705' : '\u274c';
      okCell.style.color = ok ? '#16a34a' : '#dc2626';
    }
  });
}

    });

    // 4. Build items
    const items = completionList.map(item => {
      const wh = item.fg_wh || 'G';
      const bom = item.bom || [];
      const materials = bom.map(m => {
        const tRow = (m.transfers||[]).find(t => (t.wh1_name||t.wh1||'') === wh);
        return {
          prd_no: m.prd_no,
          ratio: m.qty_per_unit || 0,
          transfer_ic_no: tRow ? (tRow.ic_no||'') : '',
          transfer_wh1: tRow ? (tRow.wh1||'') : '',
          ddjh: item.ddjh || '',
          customer: item.customer || '',
        };
      });
      return {
        fg_no: item.fg_no,
        qty: item.fg_qty||1,
        dzhw: item.danzhong||0,
        jzhw: item.jingzhong||0,
        ref: item.ref||'',
        customer: item.customer||'',
        ddjh: item.ddjh||'',
        materials,
      };
    });

    try {
      const res = await api(BASE + '/completion/batch', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({items, fg_wh: completionList[0]?.fg_wh||'G', tool_rows: toolRows})
      });
      if (res.ok) {
        toast('\u2705 \u5b8c\u5de5成\u529f\uff08\u5165\u5e93:' + (res.ic_in||'') + ' \u51fa\u5e93:' + (res.ic_out||'') + '\uff09');
        overlay.remove();
        completionList = [];
        loadCompletion();
      } else {
        toast('\u274c ' + (res.error||JSON.stringify(res)));
        btn.disabled = false; btn.textContent = '\u786e\u8ba4\u5b8c\u5de5';
      }
    } catch(e) {
      toast('\u274c ' + e.message);
      btn.disabled = false; btn.textContent = '\u786e\u8ba4\u5b8c\u5de5';
    }
  };
}



// 选成品 → 显示全部 BOM 子件，每行可选调拨单
async function selectFgCompletion(fgNo, fgName) {
  const overlay = document.getElementById('cmOverlay');
  document.querySelectorAll('#cmFgList .smo-card').forEach(el => el.style.borderColor = '');
  const card = document.getElementById('cmFg_' + fgNo);
  if (card) card.style.borderColor = 'var(--accent)';

  // 加载 BOM 子件 + 该成品可用的调拨单（并行）
  let bomRes, trRes;
  try {
    [bomRes, trRes] = await Promise.all([
      api(BASE + '/completion/bom_components?' + new URLSearchParams({fg_no: fgNo})),
      api(BASE + '/completion/transfer_by_fg?' + new URLSearchParams({fg_no: fgNo})),
    ]);
  } catch(e) { toast('加载失败: ' + e.message); return; }

  const bomItems = bomRes.items || [];
  const transferList = trRes.items || [];

  // 按调拨单品号建索引
  const byPrd = {};
  transferList.forEach(t => {
    if (!byPrd[t.prd_no]) byPrd[t.prd_no] = [];
    byPrd[t.prd_no].push(t);
  });

  // 初始分配：自动匹配 bomItems → transferList（按品号一一对应）
  const initAssignments = () => {
    const asn = {}; // prd_no → transfer item
    bomItems.forEach(b => {
      const pool = byPrd[b.prd_no] || [];
      asn[b.prd_no] = pool.find(t => t.ic_no === window.__cmAssignments[b.prd_no]?.ic_no) || pool[0] || null;
    });
    return asn;
  };
  if (!window.__cmAssignments) window.__cmAssignments = {};
  const asn = initAssignments();

  // 计算最小可完工
  const calcMin = () => {
    let min = Infinity;
    bomItems.forEach(b => {
      const t = asn[b.prd_no];
      if (!t) return;
      const available = t.remaining_qty / b.qty_per_unit;
      if (available < min) min = available;
    });
    return min === Infinity ? 0 : Math.floor(min);
  };

  const qtyInput = document.getElementById('cmQtyInput');
  const dzhwInput = document.getElementById('cmDzhwInput');
  // 自动计算净重：数量×单重(g)/1000=净重(kg)
  const calcJzhw = () => {
    const q = parseFloat(qtyInput?.value) || 0;
    const dz = parseFloat(dzhwInput?.value) || 0;
    if (q > 0 && dz > 0) {
      const jzhwInput = document.getElementById('cmJzhwInput');
      if (jzhwInput) jzhwInput.value = (q * dz / 1000).toFixed(3);
    }
  };
  qtyInput?.addEventListener('input', calcJzhw);
  dzhwInput?.addEventListener('input', calcJzhw);
  const setQty = () => {
    const m = calcMin();
    if (m > 0) qtyInput.value = Math.min(m, parseInt(qtyInput.max) || m);
    updateConfirmBtn();
  };

  // 更新确认按钮状态
  const updateConfirmBtn = () => {
    const btn = document.getElementById('cmConfirmBtn');
    if (!btn) return;
    const allAssigned = bomItems.every(b => asn[b.prd_no]);
    const qty = parseFloat(qtyInput?.value) || 0;
    btn.disabled = !allAssigned || qty <= 0;
  };

  // 渲染 BOM 行
  const bomRows = document.getElementById('cmBomRows');
  const renderRows = () => {
    if (!bomRows) return;
    const fgQty = parseFloat(qtyInput?.value) || 0;
    bomRows.innerHTML = bomItems.map(b => {
      const pool = byPrd[b.prd_no] || [];
      const assigned = asn[b.prd_no];
      const need = Math.ceil(b.qty_per_unit * fgQty * 100) / 100;
      const hasStock = !!assigned;
      return `<div style="display:flex;align-items:center;gap:6px;padding:8px;background:${hasStock ? 'var(--bg)' : 'rgba(255,80,80,0.1)'};border-radius:8px;margin-bottom:6px;border:1.5px solid ${hasStock ? 'transparent' : 'var(--red)'}">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${fmt(b.prd_no)}</div>
          <div style="font-size:11px;color:var(--sub)">${fmt(b.prd_name||'').substring(0,22)}</div>
        </div>
        <div style="font-size:12px;color:var(--sub);white-space:nowrap">×${b.qty_per_unit} → <b style="color:${hasStock?'var(--green)':'var(--red)'}">${need}</b></div>
        <select class="cmTrSel" data-prd="${b.prd_no}"
          style="padding:5px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;min-width:120px"
          ${!pool.length ? 'disabled' : ''}>
          ${!pool.length ? `<option value="">⚠️ 无调拨单</option>` : ''}
          ${pool.map(t => `<option value="${t.ic_no}" ${assigned?.ic_no===t.ic_no?'selected':''}>${t.ic_no} (剩${t.remaining_qty})</option>`).join('')}
        </select>
      </div>`;
    }).join('');

    bomRows.querySelectorAll('.cmTrSel').forEach(sel => {
      sel.addEventListener('change', () => {
        const prd = sel.dataset.prd;
        const pool = byPrd[prd] || [];
        asn[prd] = pool.find(t => t.ic_no === sel.value) || null;
        window.__cmAssignments[prd] = asn[prd];
        setQty();
        renderRows();
      });
    });
  };

  // BOM 区域显示
  const bomSection = document.getElementById('cmBomSection');
  if (bomSection) bomSection.style.display = 'block';

  // 仓库下拉
  const whSel = document.getElementById('cmWhSelect');
  if (whSel && (!window.__allWarehouses || !window.__allWarehouses.length)) {
    try {
      const whRes = await api(BASE + '/warehouses/all');
      window.__allWarehouses = whRes.warehouses || whRes.items || [];
    } catch(e) { window.__allWarehouses = []; }
  }
  if (whSel) {
    const allWh = window.__allWarehouses || [];
    whSel.innerHTML = allWh.map(w => `<option value="${w.code}"${w.code==='G'?' selected':''}>${w.name}(${w.code})</option>`).join('');
  }

  renderRows();
  setQty();

  // 保存成品信息到 window
  window.__cmFg = {fg_no: fgNo, fg_name: fgName, bomItems, asn, transferList, byPrd};

  // 完工数量变更时重新算
  qtyInput?.addEventListener('input', renderRows);

  // 确认按钮
  if (overlay) {
    const confirmBtn = overlay.querySelector('#cmConfirmBtn');
    if (confirmBtn) {
      confirmBtn.replaceWith(confirmBtn.cloneNode(true));
      overlay.querySelector('#cmConfirmBtn').addEventListener('click', () => submitCompletion(fgNo));
    }
  }
}

// 完工确认
async function submitCompletion(fgNo) {
  const fgQty = parseFloat(document.getElementById('cmQtyInput')?.value);
  const fgWh = document.getElementById('cmWhSelect')?.value || 'G';
  const cm = window.__cmFg;
  if (!cm) { toast('⚠️ 状态异常'); return; }
  if (!fgQty || fgQty <= 0) { toast('⚠️ 完工数量无效'); return; }

  // 收集所有组件（每个BOM行 × 分配到的调拨单）
  const rows = document.querySelectorAll('#cmBomRows > div');
  const components = [];
  let allAssigned = true;
  rows.forEach(row => {
    const sel = row.querySelector('.cmTrSel');
    const prdNo = sel?.dataset.prd;
    const tr = cm.byPrd[prdNo]?.find(t => t.ic_no === sel?.value);
    if (!tr) { allAssigned = false; return; }
    const inp = row.querySelector('.cmCompQty, input[type="number"]');
    const qty = parseFloat(inp?.value) || 0;
    if (qty > 0) {
      components.push({
        prd_no: prdNo,
        qty,
        transfer_ic_no: tr.ic_no,
        transfer_wh1: tr.wh1,
      });
    }
  });
  if (!allAssigned) { toast('⚠️ 每个子件都要分配调拨单'); return; }
  if (!components.length) { toast('⚠️ 子件数量为 0'); return; }

  const btn = document.getElementById('cmConfirmBtn');
  if (btn) { btn.disabled = true; btn.textContent = '处理中…'; }

  try {
    const res = await api(BASE + '/completion/confirm', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        fg_no: fgNo,
        fg_qty: fgQty,
        fg_wh: fgWh,
        danzhong: parseFloat(document.getElementById('cmDzhwInput')?.value) || 0,
        jingzhong: parseFloat(document.getElementById('cmJzhwInput')?.value) || 0,
        rem: document.getElementById('cmToolInput')?.value || '',
        components,
      }),
    });
    if (res.ok) {
      toast(`✅ 完工成功\n入库: ${res.ic_in}\n出库: ${res.ic_out}\n出库行: ${res.ic_items}行`);
      document.getElementById('cmOverlay')?.remove();
      window.__cmAssignments = null;
      loadCompletion();
    } else {
      toast('❌ 失败: ' + (res.error || JSON.stringify(res)));
    }
  } catch(e) {
    toast('❌ 网络错误: ' + e.message);
  } finally {
    const b = document.getElementById('cmConfirmBtn');
    if (b) { b.disabled = false; b.textContent = '确认完工'; }
  }
}



// ── 调拨 tab ────────────────────────────────────────────────
// 复用 stockData / stockSuggestions / 实时补全基础设施；
// 区别仅在于：选了仓库 → 弹「FROM→TO+数量+4 字段」调拨模态框；
// 调拨项入 stockBatchList 时 direction='transfer'，由 submitTransfer() 单独提交。
async function loadTransfer() {
  const el = $id('content');
  el.innerHTML = `
    <div class="list">
      <div style="padding:4px 0 8px">
        <div style="font-size:13px;color:var(--sub);margin-bottom:6px">
          输入品号或品名搜索 → 选择调拨起点仓库 → 确认目标仓库与数量
        </div>
      </div>
    </div>`;
  stockData = null;
  stockSuggestions = [];
  // 预加载所有仓库供调拨弹窗使用
  (async () => {
    try {
      const res = await api(BASE + '/warehouses/all');
      window.__allWarehouses = res.warehouses || res.items || res || [];
    } catch(e) { window.__allWarehouses = []; }
  })();
  const inp = $id('searchInput');
  if (inp) {
    inp.onkeydown = function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = inp.value.trim();
        if (stockSuggestions.length > 0) {
          const first = stockSuggestions[0];
          inp.value = first.prd_no;
          dismissSuggestions();
          stockSearchByPRD(first.prd_no);
        } else if (val) {
          stockSearchByPRD(val);
        }
      }
    };
    inp.oninput = function() {
      const val = inp.value.trim();
      if (val.length >= 2) {
        loadStockSuggestions(val);
      } else {
        dismissSuggestions();
      }
    };
  }
}

async function loadStockSuggestions(q) {
  _suggestQ = q;
  try {
    const res = await api(BASE + '/product/search?' + new URLSearchParams({q}));
    stockSuggestions = res.products || [];
    renderSuggestions();
  } catch(e) {
    dismissSuggestions();
  }
}

function renderSuggestions() {
  // 删除旧列表
  const old = document.getElementById('stockSuggestions');
  if (old) old.remove();
  if (!stockSuggestions.length) return;

  const inp = $id('searchInput');
  if (!inp) return;
  const rect = inp.getBoundingClientRect();

  const wrap = document.createElement('div');
  wrap.id = 'stockSuggestions';
  wrap.style.cssText = `
    position:fixed; left:${rect.left}px; top:${rect.bottom + 4}px;
    width:${rect.width}px; max-height:260px; overflow-y:auto;
    background:#fff; border:1px solid var(--border); border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.15); z-index:500;
  `;
  for (const p of stockSuggestions.slice(0, 8)) {
    const div = document.createElement('div');
    div.style.cssText = 'padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)';
    div.innerHTML = `<b>${hl(p.prd_no)}</b> <span style="color:var(--sub)">${hl(p.name||'')}</span>`;
    div.onmouseenter = () => div.style.background = '#f5f5f5';
    div.onmouseleave = () => div.style.background = '';
    div.onclick = () => {
      const prd = p.prd_no;
      $id('searchInput').value = prd;
      dismissSuggestions();
      if (curTab === 'smo') {
        smoSearchByPRD(prd);
      } else {
        stockSearchByPRD(prd);
      }
    };
    wrap.appendChild(div);
  }
  document.body.appendChild(wrap);
}

function dismissSuggestions() {
  const old = document.getElementById('stockSuggestions');
  if (old) old.remove();
  stockSuggestions = [];
  _suggestQ = '';
}

async function stockSearchByPRD(prdNo) {
  dismissSuggestions();
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>搜索中…</div>';
  try {
    const d = await api(BASE + '/stock?' + new URLSearchParams({prd_no: prdNo}));
    if (!d.found) {
      el.innerHTML = `<div class="list">
        <div style="padding:16px;text-align:center;color:var(--red);font-size:14px">
          ❌ 品号 <b>${fmt(prdNo)}</b> 在系统中不存在
        </div>
        <div style="padding:8px 16px;font-size:13px;color:var(--sub)">
          请从下拉列表中选择，或检查品号是否拼写错误
        </div>
      </div>`;
      return;
    }
    stockData = d;
    renderStock(d);
  } catch(e) {
    el.innerHTML = '<div class="error-msg">'+e.message+'</div>';
  }
}

function renderStock(d) {
  const el = $id('content');
  const whs = d.warehouses || [];

  // 顶部品号信息

  let header = `<div style="padding:4px 0 8px">

    <div style="font-size:12px;color:var(--sub);margin-top:2px">${fmt(d.prd_spc||'')} &nbsp;·&nbsp;总库存 <b>${fmtNum(d.total)}</b> ${fmt(d.prd_ut||'件')}</div>
  </div>`;

  let html = `<div style="padding:0 12px 80px">${header}`;

            <div class="stock-wh-qty">

            </div>
          </div>
          <div class="stock-wh-arrow">›</div>
        </div>`;

    html += `<div class="stock-wh-head" style="color:var(--orange)">无库存（${hasZero.length}个仓库有历史记录）</div>`;
    for (const w of hasZero) {
      const transferCls = curTab === 'transfer' ? ' transfer-wh-card' : '';
      const e = s => String(s||'').replace(/'/g, "\\'");
      const openFn = curTab === 'transfer' ? 'openTransferModal' : 'openInModal';
      const onClick = openFn + "('" + e(d.prd_no) + "','" + e(w.wh) + "','" + e(fmt(w.wh_name)) + "',0)";
      html += `
        <div class="stock-wh-card${transferCls}" onclick="${onClick}">
          <div class="stock-wh-icon" style="background:rgba(249,115,22,.12);color:var(--orange)">📦</div>
          <div class="stock-wh-info">
            <div class="stock-wh-name">${fmt(w.wh_name)} <span style="font-size:11px;color:var(--sub)">(${fmt(w.wh)})</span></div>
            <div class="stock-wh-qty">
              库存 <b style="color:var(--orange)">0</b> 件
            </div>
          </div>
          <div class="stock-wh-arrow">›</div>

          <div class="stock-wh-qty">添加到其他仓库</div>
        </div>

  // BOM 子件（搜成品后显示）

        <span style="width:150px;flex-shrink:0">品号</span>
        <span style="width:52px;flex-shrink:0;text-align:right">配比</span>
        <span style="width:72px;flex-shrink:0;text-align:right">库存</span>

      area2.innerHTML = headerHtml + renderTransferBomTree(tree);
    } catch(e) {

      if (area3) area3.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--red)">加载 BOM 失败</div>';

// BOM 树渲染函数（checkbox 勾选 + 纯展示）
function renderTransferBomTree(node, depth = 0) {
  const prdNo = node.prd_no;
  const knd = node.knd || '4';
  const kndLabel = knd === '3' ? '半' : knd === '4' ? '原' : '';
  const qty = node.qty_per_unit != null ? node.qty_per_unit.toFixed(5) : '1.00000';
  const stock = node.stock != null ? node.stock.toFixed(1) : '—';
  const stockColor = node.is_ready ? 'var(--green)' : 'var(--red)';
  const isSelected = (window.__curStockPrdNo && bomSelectedByProduct[window.__curStockPrdNo] && bomSelectedByProduct[window.__curStockPrdNo][prdNo]) ? true : false;
  const rowKey = prdNo + '|' + depth;
  const isRoot = depth === 0;

  let html = `<div style="
    display:flex;align-items:center;height:26px;
    padding:0 12px;
    border-bottom:1px solid var(--border);
    font-size:12px;
    ${isRoot ? 'font-weight:700;background:#F8F9FF;' : 'font-weight:400;'}
    ${isSelected ? 'background:#EEF6FF;' : ''}
  " data-key="${rowKey}" data-prd="${prdNo}" data-name="${htmlJsonEscape(node.prd_name||'')}" data-qty="${qty}" data-stock="${stock}" data-depth="${depth}" onclick="bomRowClick(this)">
    <span style="width:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center">
      <input type="checkbox" class="bom-row-check" ${isSelected ? 'checked' : ''} onchange="updateBOMSelected()" style="cursor:pointer">
    </span>
    <span style="width:28px;flex-shrink:0;text-align:center;font-size:11px;color:var(--sub)">${kndLabel}</span>
    <span style="width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${isRoot?'700':'500'}">${fmt(prdNo)}</span>
    <span style="width:52px;flex-shrink:0;text-align:right;color:var(--text)">${qty}</span>
    <span style="width:72px;flex-shrink:0;text-align:right;font-weight:600;color:${stockColor}">${stock}</span>
    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:11px;margin-left:4px">${fmt(node.prd_name||'')}</span>
  </div>`;

  if (node.children) {
    node.children.forEach(child => {
      html += renderTransferBomTree(child, depth + 1);
    });
  }
  return html;
}

// 清除全部 BOM 暂存
function clearAllBOMStaging() {
  bomSelectedByProduct = {};
  batchFormData = {};
  document.querySelectorAll('.bom-row-check').forEach(cb => { cb.checked = false; });
  const countWrap = $id('bomBatchCountWrap');
  const countEl = $id('bomBatchCount');

// 存储完整的 BOM 行数据（含母件品号）
let bomSelectedByProduct = {};
// { parentPrd_no -> { childPrd_no -> { prd_no, prd_name, wh_stock, qty_per_unit, parentPrd_no, parentPrdName } } }
// 记录 BOM 弹窗表单值的全局存储 { prd_no_parent -> { rowKey -> { ref, ddjh, wh_from, qty, dz, jz } } }
let batchFormData = {};

// 事件委托：全局监听 BOM 勾选，页面加载时绑定一次即可
document.addEventListener('change', (e) => {
  if (e.target.classList.contains('bom-row-check')) {
    updateBOMSelected();
  }
  if (e.target.id === 'bomCheckAll') {
    const checked = e.target.checked;
    document.querySelectorAll('.bom-row-check').forEach(cb => { cb.checked = checked; });
    updateBOMSelected();
  }
});

// BOM 行点击：切换勾选 + 更新已选
function bomRowClick(div) {
  const cb = div.querySelector('.bom-row-check');
  if (!cb) return;
  cb.checked = !cb.checked;
  updateBOMSelected();
}

function updateBOMSelected() {
  const checks = document.querySelectorAll('.bom-row-check:checked');
  const curPrd = window.__curStockPrdNo || '';
  if (!curPrd) return;

  if (!bomSelectedByProduct[curPrd]) bomSelectedByProduct[curPrd] = {};
  // 先清当前产品的选择
  bomSelectedByProduct[curPrd] = {};
  checks.forEach(cb => {
    const div = cb.closest('[data-key]');
    if (!div) return;
    const prdNo = div.dataset.prd || '';
    if (!prdNo) return;
    const row = {
      prd_no: prdNo,
      prd_name: div.dataset.name || '',
      qty_per_unit: parseFloat(div.dataset.qty) || 0,
      qty: parseFloat(div.dataset.stock) || 0,
      parentPrdNo: curPrd,
      parentPrdName: window.__curStockPrdName || '',
    };
    bomSelectedByProduct[curPrd][prdNo] = row;
  });

  // 总已选数（跨所有产品）
  let totalN = 0;
  Object.values(bomSelectedByProduct).forEach(m => { totalN += Object.keys(m).length; });

  const countWrap = $id('bomBatchCountWrap');
  const countEl = $id('bomBatchCount');
  if (countWrap) countWrap.style.display = totalN ? '' : 'none';
  if (countEl) countEl.textContent = totalN;
}

function pmcToggleSel(key, idx) {
  var items = window.__pmcItems || [];
  var t = items[parseInt(idx)];
  if (!t) return;
  // pmcSelected is an array: [{so_no_itm, prd_no, qty}]
  var exists = pmcSelected.findIndex(function(x) {
    return (x.so_no_itm||'') === (t.so_no_itm||'') && (x.prd_no||'') === (t.prd_no||t.PRD_NO||'');
  });
  if (exists >= 0) {
    pmcSelected.splice(exists, 1);
  } else {
    pmcSelected.push({
      so_no_itm: t.so_no_itm||'',
      so_no: t.os_no||t.SO_NO||'',
      prd_no: t.prd_no||t.PRD_NO||'',
      qty: parseFloat(t.qty||t.QTY||0)
    });
  }
  renderPMCList(items, $id('pmcSearch') ? $id('pmcSearch').value : '');
}

window.__pmcSearchFn = function(q) {
  renderPMCList(window.__pmcItems || [], q);
};

// ── PMC 批量提交（旧版）──────────────────────────────────────────────
async function pmcSubmit() {
  if (!pmcSelected || !pmcSelected.length) {
    alert('\u8bf7\u5148\u9009\u4e2d\u8ba1\u5355');
    return;
  }
  var el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>\u751f成 MPS \u4e2d\u2026</div>';
  try {
    var res = await api(BASE + '/pmc/generate_mps', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items: pmcSelected})
    });
    if (res.error) { el.innerHTML = '<div class="error-msg">' + res.error + '</div>'; return; }
    var results = res.results || (res.mps_no ? [res] : []);
    var mpsList = results.map(function(r) { return r.mps_no; }).filter(Boolean).join(' / ') || res.mps_no || '\u2014';
    var totalItm = results.reduce(function(s, r) { return s + (r.total_itm || 0); }, 0);
    el.innerHTML = '<div style="padding:20px;text-align:center"><div style="font-size:16px;font-weight:600;color:var(--green);margin-bottom:8px">✓ MPS \u751f成\u5b8c成</div><div style="font-size:14px;word-break:break-all">' + mpsList + '</div><div style="font-size:13px;color:var(--sub);margin-top:6px">' + results.length + ' \u5f20\u5de5\u5355 \u00b7 ' + totalItm + ' \u4e2a ITM</div><div style="margin-top:16px"><button onclick="loadPMC()" style="padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer">\u7ee7\u7eed\u5206\u6790</button></div></div>';
  } catch(e) { el.innerHTML = '<div class="error-msg">' + e.message + '</div>'; }
}

// PMC 批量预览（BOM 树合并）
async function pmcPreviewBatch() {
  if (!pmcSelected || !pmcSelected.length) { alert('\u8bf7\u5148\u9009\u4e2d\u8ba1\u5355'); return; }
  var el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>加载中\u2026</div>';
  var allRows = [];
  try {
    for (var i = 0; i < pmcSelected.length; i++) {
      var it = pmcSelected[i];
      var data = await api(BASE + '/pmc/preview_mps?' + new URLSearchParams({so_no_itm: it.so_no_itm, prd_no: it.prd_no, qty: it.qty}));
      if (data.items) allRows = allRows.concat(data.items);
    }
    renderPMCTree(allRows, pmcSelected.length + ' 条指令单合并');
  } catch(e) { el.innerHTML = '<div class="error-msg">' + e.message + '</div>'; }
}

// PMC 批量生成
async function pmcGenerateBatch() {
  await pmcSubmit();
}

// PMC 单行分析 → BOM 树
