<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>安而固 ERP</title>
  <style>
    :root {
      --bg: #f0f2f5; --card: #fff; --text: #1a1a1a; --sub: #888; --name: #374151;
      --accent: #2563eb; --green: #16a34a; --red: #dc2626; --orange: #d97706;
      --border: #e5e7eb; --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--accent); color: #fff;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(37,99,235,.25);
    }
    .topbar h1 { font-size: 17px; font-weight: 600; flex: 1; }
    .tab-bar {
      background: #fff; display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; text-align: center; padding: 10px 16px;
      font-size: 14px; font-weight: 500; color: var(--sub);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .15s; white-space: nowrap;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; border-radius: 9px;
      background: var(--bg); color: var(--sub); font-size: 11px; font-weight: 700;
      margin-left: 4px; padding: 0 4px;
    }
    .tab-btn.active .tab-count { background: var(--accent); color: #fff; }
    .filter-bar {
      background: #fff; padding: 10px 16px;
      display: flex; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .filter-tab {
      flex-shrink: 0; padding: 5px 14px; border-radius: 20px;
      font-size: 13px; border: 1px solid var(--border);
      background: #fff; color: var(--sub); cursor: pointer; transition: all .15s;
    }
    .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pmc-card {
      border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; margin: 6px 12px;
      display: flex; align-items: flex-start; gap: 10px; background: #fff; transition: all .15s;
    }
    .pmc-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .pmc-card-sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .pmc-card-sel:hover { box-shadow: 0 0 0 3px rgba(59,130,246,.25), 0 2px 8px rgba(59,130,246,.1); }
    .state-msg { text-align: center; padding: 48px 16px; color: var(--sub); font-size: 14px; }
    .spinner {
      width: 24px; height: 24px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 24px auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { text-align: center; padding: 16px; color: var(--red); font-size: 14px; }
    .list { padding: 12px 12px 80px; }

    /* ── 请购单卡片 ───────────────────────── */
    .qts-row {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px;
      cursor: pointer; transition: box-shadow .15s;
    }
    .qts-row:active { box-shadow: none; }
    .qts-row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; min-width: 0; }
    .qts-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .qts-status.open { background: #dcfce7; color: #16a34a; }
    .qts-status.closed { background: #f3f4f6; color: #6b7280; }
    .qts-no { font-weight: 700; font-size: 14px; }
    .qts-cus { font-size: 12px; color: var(--accent); font-weight: 500; }
    .qts-date { font-size: 12px; color: var(--sub); }
    .qts-cus-code { font-size: 11px; background: #dbeafe; color: #1d4ed8; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .search-bar {
      background: #fff; padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
    .search-bar input {
      flex: 1; padding: 7px 12px; border: 1px solid var(--border);
      border-radius: 20px; font-size: 14px; outline: none;
      background: var(--bg);
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--sub); }
    .search-clear {
      background: none; border: none; color: var(--sub);
      font-size: 16px; cursor: pointer; padding: 4px; line-height: 1;
      display: none;
    }
    .search-clear.show { display: block; }
    mark { background: #fff176; color: #1a1a1a; border-radius: 2px; padding: 0 1px; }
    .qts-row-body { display: flex; flex-direction: column; gap: 4px; }
    .qts-prd { display: flex; gap: 8px; }
    .qts-pno { font-weight: 600; font-size: 13px; color: var(--text); }
    .qts-pname { font-size: 13px; color: var(--name); flex: 1; word-break: break-all; }
    .qts-row-foot { display: flex; gap: 12px; font-size: 12px; color: var(--sub); }
    .qts-row-foot b { color: var(--text); }
    .qts-row-meta { display: flex; gap: 12px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; flex-wrap: wrap; }
    .qts-detail-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
    .qts-detail-row { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 8px; }
    .qts-header { padding-bottom: 6px; }
    .qts-no { font-weight: 700; font-size: 15px; }
    .qts-dt { color: var(--sub); font-size: 13px; margin-top: 2px; }
    .qts-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .qts-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .qts-meta { font-size: 12px; color: var(--sub); }
    .qts-meta span { margin-right: 10px; }

    /* ── Section / Group ─────────────────── */
    .smo-section { margin-bottom: 16px; }
    .smo-section-head {
      padding: 8px 14px; border-radius: 8px;
      font-weight: 700; font-size: 14px; margin-bottom: 4px;
      background: #fff; color: var(--text);
      border-bottom: 2px solid var(--accent);
    }
    .smo-sub-section { margin-bottom: 4px; }
    .smo-sub-head {
      padding: 4px 8px; font-size: 13px; font-weight: 600;
      color: var(--sub); border-left: 3px solid;
      margin: 4px 0;
    }

    /* ── SMO Card ─────────────────────────── */
    .smo-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px;
      margin-bottom: 10px; position: relative;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .15s, box-shadow .15s;
      min-width: 0; /* 防止 flex 子项横向溢出 */
    }
    .smo-card.selected {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(220,38,38,.15);
    }
    .smo-card.unclickable {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .smo-card.transferred {
      cursor: not-allowed;
      opacity: 0.65;
    }
    .smo-card.dispatch-ready {
      /* 默认无边框，选中后才有绿色边框 */
    }
    .smo-card.selected {
      border-color: var(--green) !important;
      box-shadow: 0 0 0 3px rgba(34,197,94,.2);
    }
    .smo-card-header { padding-bottom: 6px; }
    .dispatch-mat-list { background: var(--bg); border-radius: 8px; overflow: hidden; }
    .smo-fg { font-weight: 700; font-size: 15px; word-break: break-all; }
    .smo-fg-name { color: var(--name); font-size: 14px; margin-top: 2px; word-break: break-all; }
    .smo-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .smo-bom-rows { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
    .smo-bom-row { padding: 4px 0; min-width: 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .smo-bom-row-prd { font-weight: 600; font-size: 13px; word-break: break-all; flex: 0 0 auto; }
    .smo-bom-row-name { color: var(--name); font-size: 13px; flex: 1 1 auto; min-width: 0; word-break: break-all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .smo-bom-row-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .smo-bom-row .ok { color: var(--green); font-size: 12px; }
    .smo-bom-row .part { color: var(--orange); font-size: 12px; }
    .smo-bom-row .no { color: var(--red); font-size: 12px; }
    .smo-bom-row-wh { color: var(--sub); font-size: 11px; }
    .smo-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
    .smo-qty-row { font-size: 12px; color: var(--text); white-space: nowrap; }
    .smo-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--sub); flex: 1; min-width: 0; }
    .smo-meta span { word-break: break-all; min-width: 0; }
    .stock { font-size: 12px; }
    .ready-box { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 14px; font-size: 12px; font-weight: 600; }
    .ready-box.ok { background: #dcfce7; color: var(--green); }
    .ready-box.no { background: #fee2e2; color: var(--red); }
    .ready-box.warn { background: #fef3c7; color: var(--orange); }

    /* ── 盘点仓库卡片 ─────────────────────────── */
    .stock-wh-head { font-size: 12px; color: var(--sub); padding: 4px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    .stock-wh-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px;
      cursor: pointer; transition: box-shadow .15s;
    }
    .stock-wh-card:active { box-shadow: none; }
    .stock-wh-card.stock-wh-new {
      border: 2px dashed var(--border); background: #fafafa;
      color: var(--sub);
    }
    .stock-wh-icon { font-size: 24px; line-height: 1; flex-shrink: 0; width: 36px; text-align: center; }
    .stock-wh-info { flex: 1; min-width: 0; }
    .stock-wh-name { font-weight: 600; font-size: 14px; color: var(--text); }
    .stock-wh-qty { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .stock-wh-arrow { font-size: 20px; color: var(--sub); flex-shrink: 0; }

    /* ── Checkbox (hidden) ───────────────────── */
    .smo-check-wrap { display: none; }

    /* ── FAB (floating +) ────────────────── */
    .fab {
      position: fixed; bottom: 28px; right: 24px; z-index: 200;
      width: 52px; height: 52px; border-radius: 26px;
      background: var(--green); color: #fff;
      font-size: 32px; font-weight: 300; line-height: 52px; text-align: center;
      box-shadow: 0 4px 16px rgba(22,163,74,.4);
      cursor: pointer; display: none;
      transition: transform .15s, box-shadow .15s;
    }
    .fab.show { display: block; }
    .fab:active { transform: scale(.93); }

    /* ── Modal ────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.5);
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 600px; max-height: 88vh;
      display: flex; flex-direction: column;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } }
    .modal-head {
      padding: 16px 16px 0;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .modal-head h2 { font-size: 16px; font-weight: 600; flex: 1; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg); font-size: 18px; cursor: pointer; color: var(--sub);
    }
    .modal-tabs {
      display: flex; padding: 12px 16px 0; gap: 8px; flex-shrink: 0;
    }
    .modal-tab {
      flex: 1; padding: 8px 0; text-align: center; font-size: 14px;
      border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 500;
      border: 1px solid var(--border); border-bottom: none;
      color: var(--sub); background: var(--bg);
    }
    .modal-tab.active { background: var(--card); color: var(--text); }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 12px 16px 16px;
    }

    /* ── Issue rows ──────────────────────── */
    .issue-row {
      background: var(--bg); border-radius: 10px; padding: 12px;
      margin-bottom: 8px;
    }
    .issue-row-top {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .issue-prd { font-weight: 700; font-size: 14px; flex: 1; }
    .issue-name { font-size: 13px; color: var(--name); }
    .issue-stock { font-size: 11px; color: var(--sub); }
    .issue-stock span { margin-right: 8px; }
    .issue-stock .shortage { color: var(--red); font-weight: 600; }
    .issue-stock .enough { color: var(--green); font-weight: 600; }
    .issue-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
    .issue-field label { font-size: 11px; color: var(--sub); display: block; margin-bottom: 3px; }
    .issue-field input, .issue-field select {
      width: 100%; padding: 6px 8px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--text);
    }
    .issue-field input[type="number"] { text-align: right; }
    .issue-type-tag {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      font-weight: 600;
    }
    .issue-type-tag.prod { background: #dbeafe; color: #1d4ed8; }
    .issue-type-tag.sub { background: #fef3c7; color: #92400e; }

    /* ── Modal footer ────────────────────── */
    .modal-footer {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; flex-shrink: 0;
    }
    .btn-confirm {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      background: var(--green); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .btn-confirm:active { opacity: .85; }
    .btn-cancel {
      padding: 12px 20px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text); font-size: 15px; cursor: pointer;
    }

    /* ── Toast ───────────────────────────── */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.8); color: #fff; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; z-index: 600;
      display: none; white-space: nowrap;
    }
    .toast.show { display: block; animation: fadeIn .2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
    /* 采购未回 工具栏+分页 */
    .pos-un-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 4px; font-size: 13px; gap: 8px; }
    .pos-un-toolbar select { padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; }
    .pos-un-info { color: var(--sub); font-size: 12px; }
    .pos-un-filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pos-un-filter-row label { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 3px; }
    .pos-un-filter-row input { padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border); font-size: 12px; width: 80px; }
    .pos-un-filter-reset { font-size: 12px; color: var(--accent); cursor: pointer; border: none; background: none; padding: 2px 4px; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 4px; }
    .pager button { padding: 6px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; }
    .pager button:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }
    .pager span { font-size: 13px; color: var(--sub); }

    /* ── 待升单列表：FAB + 侧边栏 ─────────────── */
    .stock-batch-fab {
      position: fixed; right: 16px; bottom: 24px; z-index: 500;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); color: #fff; border: none;
      font-size: 26px; cursor: pointer; box-shadow: 0 4px 14px rgba(37,99,235,.4);
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; transition: transform .15s;
    }
    .stock-batch-fab:active { transform: scale(.95); }
    .stock-batch-fab-badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 22px; height: 22px; padding: 0 6px;
      background: var(--red); color: #fff; border-radius: 11px;
      font-size: 12px; font-weight: 700; line-height: 22px;
      text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .stock-batch-overlay {
      display: none;
    }
    .stock-batch-overlay.show { display: block; }
    .stock-batch-side {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 470;
      width: 100%; max-width: 380px;
      background: var(--card); box-shadow: -4px 0 16px rgba(0,0,0,.12);
      transform: translateX(100%); transition: transform .25s ease;
      display: flex; flex-direction: column;
      font-family: inherit;
    }
    .stock-batch-side.show { transform: translateX(0); }
    .stock-batch-head {
      padding: 14px 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .stock-batch-head .title { font-size: 15px; font-weight: 700; flex: 1; color: var(--text); }
    .stock-batch-head .count {
      background: var(--accent); color: #fff;
      padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 700;
    }
    .stock-batch-head .close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg); font-size: 18px; cursor: pointer; color: var(--sub);
    }
    .stock-batch-body { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .stock-batch-empty {
      padding: 60px 16px; text-align: center; color: var(--sub); font-size: 13px;
    }
    .batch-row {
      background: var(--bg); border-radius: 10px; padding: 10px;
      margin-bottom: 8px; border: 1px solid var(--border);
    }
    .batch-row-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .batch-row-dir {
      font-size: 11px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; flex-shrink: 0;
    }
    .batch-row-dir.out { background: #fee2e2; color: var(--red); }
    .batch-row-dir.in  { background: #dcfce7; color: var(--green); }
    .batch-row-prd {
      flex: 1; font-size: 13px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .batch-row-del {
      width: 26px; height: 26px; border-radius: 50%; border: none;
      background: var(--card); color: var(--sub); cursor: pointer;
      font-size: 14px; line-height: 1; flex-shrink: 0;
    }
    .batch-row-meta {
      font-size: 12px; color: var(--sub); margin-bottom: 8px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .batch-row-meta b { color: var(--text); font-weight: 600; }
    .batch-row-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .batch-row-grid label {
      display: block; font-size: 10px; color: var(--sub);
      margin-bottom: 2px; font-weight: 600;
    }
    .batch-row-grid input {
      width: 100%; box-sizing: border-box;
      padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 12px;
      font-family: inherit; outline: none; background: var(--card);
    }
    .stock-batch-foot {
      padding: 12px; border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      flex-shrink: 0; background: var(--card);
    }
    .stock-batch-foot .btn-clear {
      grid-column: span 2; padding: 8px;
      background: var(--card); color: var(--sub);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .stock-batch-foot .btn-clear:disabled {
      opacity: .4; cursor: not-allowed;
    }
    .stock-batch-foot .btn-up {
      padding: 12px 8px; border-radius: 10px;
      border: 1.5px solid; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .stock-batch-foot .btn-up:disabled { opacity: .4; cursor: not-allowed; }
    .stock-batch-foot .btn-up-out {
      background: #fee2e2; color: var(--red); border-color: #fca5a5;
    }
    .stock-batch-foot .btn-up-in {

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const BASE = '/api';
let curTab = 'qts';
let curFilter = 'pending';
let selected = new Set(); // ref_itm (MO_NO) keys
let rawData = []; // 存储原始数据供搜索过滤
let curSearch = ''; // 当前搜索词

// ── Utils ───────────────────────────────────────────────────────────────────
// 统一网络入口：非 2xx 抛 Error（带 status / data），2xx 仍返回解析后的 JSON（成功契约不变）
function api(url, opts) {
  return fetch(url, opts).then(function (r) {
    return r.text().then(function (t) {
      var d = null;
      try { d = t ? JSON.parse(t) : null; } catch (e) { d = null; }
      if (r.ok) {
        // 写库成功（POST/PUT/DELETE）→ 清全厂净需求缓存并立即重取，省掉手工刷新页面。
        // 复用同一 api() 入口，一处覆盖所有写接口；取不到也只是不刷新，绝不挡主流程。
        if (opts && opts.method && String(opts.method).toUpperCase() !== 'GET') {
          window.__gnMap = null; window.__gnTs = 0; window.__gnLoading = null;
          try { gnEnsureMap(); } catch (e) {}
        }
        return d === null ? {} : d;
      }
      var msg;
      if (d && typeof d.detail === 'string') {
        msg = d.detail;                                  // FastAPI HTTPException 的 detail 字符串
      } else if (d && Array.isArray(d.detail) && d.detail.length) {
        var f = d.detail[0] || {};                       // FastAPI 参数校验错（422）
        msg = (r.status === 422 ? '参数错误：' : '') + (f.msg || '参数不合法')
            + (f.loc ? '（' + f.loc.join('.') + '）' : '');
      } else if (d && d.error) {
        msg = d.error;
      } else if (t && !d) {
        msg = t.slice(0, 120);                           // 500 纯文本（不是 JSON）→ 直接显示，不再抛 SyntaxError
      } else {
        msg = 'HTTP ' + r.status;
      }
      var err = new Error(msg);
      err.status = r.status; err.data = d;
      throw err;
    });
  });
}
function fmt(v) { return v == null || v === '' ? '' : String(v); }
// 适合 HTML data-attribute 里 JSON 的转义（处理 HTMLEncode 后仍然残留的问题）
function htmlJsonEscape(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


function escAttr(v) { return v.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escHtml(v) { return v == null ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(v) { return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
function fmtNum(v) { return v == null ? '' : Number(v).toLocaleString('zh-CN'); }
let _toastTimer = null;
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  // 清掉上一条的定时器：否则上一条 2.5s 的 timeout 会把这一条的 show 提前摘掉（连发两条时第二条看不见）
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}
function $id(id) { return document.getElementById(id); }

// ── Search ─────────────────────────────────────────────────────────────────
function highlight(s, q) {
  if (!q || !s) return fmt(s);
  return fmt(s).replace(new RegExp(escapeRegex(q), 'gi'), m => `<mark>${m}</mark>`);
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function handleSearch(v) {
  const q = v.trim();
  curSearch = q;
  $id('searchClear').classList.toggle('show', q.length > 0);

  switch (curTab) {
    case 'pos-unreceived':
      loadPosUnreceived(q); break;
    case 'qts':
      if (!q) { renderQts(rawData, ''); break; }
      renderQts(rawData.filter(r => JSON.stringify(r).toLowerCase().includes(q.toLowerCase())), q); break;
    case 'globalnet':
      gnQ = q; gnRenderRows(); break;
    case 'smo':
      if (!q) { loadSmo(); break; }
      loadStockSuggestions(q); break;
    case 'stock':
      if (!q) { loadStock(); break; }
      loadStockSuggestions(q); break;
    case 'completion':
      if (!q) { loadCompletion(); break; }
      if (!completionData.length) { loadCompletion(); break; }
      renderCompletionListFiltered(completionData.filter(r => JSON.stringify(r).toLowerCase().includes(q.toLowerCase()))); break;
    case 'pmc':
      (async () => {
        try {
          const data = await api(BASE + '/pmc/pos_unanalyzed?' + new URLSearchParams({q: q||''}));
          renderPMCList(data.items || [], q||'');
        } catch(e) {
          // Step A：原来渲染成"暂无数据"（误导：其实是请求失败）
          const el = $id('content');
          if (el) el.innerHTML = '<div class="error-msg">加载失败: ' + e.message + '</div>';
        }
      })();
      break;
  }
}

// 单价显示开关（👁 按钮）：切换 .price-val 的 display，状态记在 body[data-price-locked]
function togglePriceLock() {
  const on = document.body.dataset.priceLocked !== '1';
  document.body.dataset.priceLocked = on ? '1' : '0';
  document.querySelectorAll('.price-val').forEach(el => el.style.display = on ? 'inline' : 'none');
}

function clearSearch() {
  $id('searchInput').value = '';
  $id('searchClear').classList.remove('show');
  curSearch = '';
  handleSearch('');
}

// ── Tab / Filter ────────────────────────────────────────────────────────────
// Main tab bar
const mainTabBar = document.querySelector('.tab-bar');
mainTabBar.addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    mainTabBar.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');

    if (btn.dataset.tab) {
      // Main tab
      curTab = btn.dataset.tab;
      // 切换时清除盘点tab的autocomplete残留
      if (typeof dismissSuggestions === 'function') dismissSuggestions();
      stockSuggestions = [];
      $id('searchBar').style.display = 'flex';
      $id('searchInput').value = '';
      $id('searchClear').classList.remove('show');
      curSearch = '';
      if (curTab === 'pos-unreceived') {
        posUnSearch = ''; posUnQ = '';
        posUnCustomer = ''; posUnSupplier = ''; posUnOrderNo = '';
      }
      if (curTab === 'smo') {
        loadSmo();
      } else if (curTab === 'pos-unreceived') {
        loadPosUnreceived();
      } else if (curTab === 'stock') {
        loadStock();
      } else if (curTab === 'transfer') {
        loadTransfer();
      } else if (curTab === 'completion') {
        loadCompletion();
      } else if (curTab === 'pmc') {
        loadPMC();
      } else if (curTab === 'globalnet') {
        loadGlobalNet();
      } else {
        loadQts();
      }
    }
  });

// ── 请购单 ──────────────────────────────────────────────────────────────────
let qtsSupplier = '', qtsOrderNo = '';

async function loadQts() {
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>加载中…</div>';
  try {
    const params = new URLSearchParams({});
    if (qtsSupplier) params.set('supplier', qtsSupplier);
    if (qtsOrderNo)  params.set('order_no',  qtsOrderNo);
    const data = await api(BASE + '/qts?' + params);
    rawData = data.items || [];
    renderQts(rawData, '');
  } catch(e) { el.innerHTML = '<div class="error-msg">'+e.message+'</div>'; }
}

function applyQtsFilters() {
  qtsSupplier = ($id('qtsFSupplier') || {value:''}).value.trim();
  qtsOrderNo  = ($id('qtsFOrderNo')  || {value:''}).value.trim();
  loadQts();
}

function resetQtsFilters() {
  qtsSupplier = ''; qtsOrderNo = '';
  loadQts();
}

function renderQts(items, q) {
  const el = $id('content');
  const toolbar = `
<div class="pos-un-toolbar" style="padding:8px 12px">
  <span class="pos-un-filter-row">
    <label>供应商<input type="text" id="qtsFSupplier" value="${escAttr(qtsSupplier)}" placeholder="筛选" autocomplete="off" onkeydown="if(event.key==='Enter')applyQtsFilters()"></label>
    <label>指令单<input type="text" id="qtsFOrderNo" value="${escAttr(qtsOrderNo)}" placeholder="筛选" autocomplete="off" onkeydown="if(event.key==='Enter')applyQtsFilters()"></label>
    <button class="pos-un-filter-reset" onclick="resetQtsFilters()">清除</button>
    <button onclick="applyQtsFilters()">筛选</button>
  </span>
  <span class="pos-un-info">${items.length} 条</span>
</div>`;
  if (!items || !items.length) { el.innerHTML=toolbar+'<div class="state-msg">暂无请购单</div>'; return; }
  let h = toolbar + '<div class="list">';
  for (const r of items) {
    const closed = r.cls_id;
    h += `<div class="qts-row">
      <div class="qts-row-head">
        <span class="qts-status ${closed?'closed':'open'}">${closed?'已结':'未结'}</span>
        <span class="qts-no">${highlight(r.qt_no, q)}</span>
        <span class="qts-date">${highlight(r.qt_dd, q)}</span>
      </div>
      <div class="qts-row-body">
        <div class="qts-prd">
          <span class="qts-pno">${highlight(r.prd_no, q)}</span>
          <span class="qts-pname">${highlight(r.prd_name, q)||'—'}</span>
        </div>
        <div class="qts-row-foot">
          <span>数量: <b>${r.qty} ${fmt(r.ut)}</b></span>
          <span>上次单价: <b class="price-val">${r.last_up ? '¥'+Number(r.last_up).toFixed(4) : '—'}</b><span class="price-lock-icon">🔒</span></span>
        </div>
      </div>
      <div class="qts-row-meta">
        <span>交期: ${highlight(r.est_dd, q)||'—'}</span>
        <span>指令单: ${highlight(r.order_no, q)||'—'}</span>
        <span>供应商: ${highlight(r.supplier, q)||'—'}</span>
      </div>
    </div>`;
  }
  el.innerHTML = h + '</div>';
}

// ── 采购未回 ─────────────────────────────────────────────────────────────────
let posUnTotal = 0;
let posUnQ = '', posUnCustomer = '', posUnSupplier = '', posUnOrderNo = '';

async function loadPosUnreceived(q) {
  posUnQ = (q !== undefined ? q : '').trim();
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>加载中…</div>';
  try {
    const params = new URLSearchParams({});
    const search = (q !== undefined ? q : '').trim();
    if (search) params.set('q', search);
    if (posUnCustomer) params.set('customer', posUnCustomer);
    if (posUnSupplier) params.set('supplier', posUnSupplier);
    if (posUnOrderNo) params.set('order_no', posUnOrderNo);
    const data = await api(BASE + '/pos-unreceived?' + params);
    const items = data.items || [];
    posUnTotal = data.total || 0;
    renderPosUnreceived(items, posUnQ);
  } catch(e) { el.innerHTML = '<div class="error-msg">'+e.message+'</div>'; }
}

function renderPosUnreceived(items) {
  const el = $id('content');
  const q = posUnQ;
  const qC = posUnCustomer;
  const qS = posUnSupplier;
  const qO = posUnOrderNo;
  const anyQ = q || qC || qS || qO;

  let h = `
    <div class="pos-un-toolbar">
      <span class="pos-un-filter-row">
        <input type="text" id="posUnFCustomer" value="${escAttr(posUnCustomer)}" placeholder="客户筛选…" autocomplete="off" onkeydown="if(event.key==='Enter')applyPosUnFilters()" style="flex:1;min-width:80px">
        <input type="text" id="posUnFSupplier" value="${escAttr(posUnSupplier)}" placeholder="供应商筛选…" autocomplete="off" onkeydown="if(event.key==='Enter')applyPosUnFilters()" style="flex:1;min-width:80px">
        <input type="text" id="posUnFOrderNo" value="${escAttr(posUnOrderNo)}" placeholder="指令单筛选…" autocomplete="off" onkeydown="if(event.key==='Enter')applyPosUnFilters()" style="flex:1;min-width:80px">
        <button class="pos-un-filter-reset" onclick="resetPosUnFilters()">清除</button>
        <button onclick="applyPosUnFilters()">筛选</button>
      </span>
      <span class="pos-un-info">${posUnTotal} 条</span>
    </div>`;

  if (!items.length) {
    el.innerHTML = h + '<div class="state-msg">暂无采购未回</div>';
    return;
  }

  h += '<div class="list">';
  for (const r of items) {
    h += `<div class="qts-row">
      <div class="qts-row-head">
        <span class="qts-status open">未入库</span>
        <span class="qts-no">${highlight(fmt(r.os_no), q)}</span>
        <span class="qts-date">${fmt(r.os_dd)}</span>
        ${r.customer ? `<span class="qts-cus">${highlight(r.customer, qC || q)}</span>` : ''}
      </div>
      <div class="qts-row-body">
        <div class="qts-prd">
          <span class="qts-pno">${highlight(fmt(r.prd_no), q)}</span>
          <span class="qts-pname">${highlight(fmt(r.prd_name)||'—', q)}</span>
        </div>
        <div class="qts-row-foot">
          <span>未回: <b>${r.unreceived} ${fmt(r.ut)}</b></span>

      <div class="qts-row-meta">
        <span>交期: ${fmt(r.est_dd)||'—'}</span>
        <span>指令单: ${highlight(fmt(r.order_no)||'—', qO)}</span>
        ${r.supplier ? `<span>供应商: ${highlight(r.supplier, qS || q)}</span>` : ''}
      </div>
    </div>`;
  }
  h += '</div>';
  el.innerHTML = h;
}

function applyPosUnFilters() {
  posUnCustomer = ($id('posUnFCustomer') || {value:''}).value.trim();
  posUnSupplier = ($id('posUnFSupplier') || {value:''}).value.trim();
  posUnOrderNo  = ($id('posUnFOrderNo')  || {value:''}).value.trim();
  loadPosUnreceived();
}

function resetPosUnFilters() {
  posUnQ = ''; posUnCustomer = ''; posUnSupplier = ''; posUnOrderNo = '';
  const elC = $id('posUnFCustomer'), elS = $id('posUnFSupplier'), elO = $id('posUnFOrderNo');

  if (elS) elS.value = '';

}

// ── 派工单 SMO ─────────────────────────────────────────────────────────────
let smoFullData = []; // SMO tab 新版不使用（派工单发料改到其他Tab）
async function loadSmo() {
  const el = $id('content');
  el.innerHTML = `
    <div class="list">
      <div style="padding:4px 0 8px">
        <div style="font-size:13px;color:var(--sub);margin-bottom:6px">输入品号或品名搜索（支持下拉选择）</div>
      </div>
    </div>`;
  // 清空全局搜索框
  const inp = $id('searchInput');
  if (inp) inp.value = '';
  $id('searchClear')?.classList.remove('show');
  curSearch = '';
  // 只接管回车键（点击建议/按回车 → 调 BOM 接口）
  if (inp) {
    inp.onkeydown = function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = inp.value.trim();
        if (stockSuggestions.length > 0) {
          const first = stockSuggestions[0];
          inp.value = first.prd_no;
          dismissSuggestions();
          smoSearchByPRD(first.prd_no);
        } else if (val) {
          smoSearchByPRD(val);

}

async function smoSearchByPRD(prdNo) {
  dismissSuggestions();
  const el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>搜索中…</div>';
  try {
    const d = await api(BASE + '/smo/bom_stock?' + new URLSearchParams({fg_no: prdNo}));

      el.innerHTML = `<div class="list">

          ⚠️ 品号 <b>${fmt(prdNo)}</b> 无 BOM 子件

    el.innerHTML = '<div class="error-msg">'+e.message+'</div>';

}

function renderBomStock(d) {
  const el = $id('content');
  const summary = `
    <div class="smo-card" style="background:var(--bg2);margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <b style="font-size:15px">${fmt(d.fg_no)}</b>
        <span style="font-size:13px;color:var(--name)">${fmt(d.fg_name||'').substring(0,40)}</span>
      </div>
      <div style="font-size:12px;color:var(--sub)">
        ${d.node_count} 节点 · 最深 D${d.max_depth} ·
        <span style="color:${d.ready_count===d.node_count?'var(--green)':'var(--orange)'}">
          ${d.ready_count} 齐料 · ${d.shortage_count} 缺料
        </span>
      </div>
    </div>`;

  // 渲染嵌套树节点（递归）
  function renderNode(node, depth) {
    const isLeaf  = node.is_leaf;
    const stock  = node.stock;
    const short  = node.shortage;
    const qty    = node.qty_per_unit;
    const name   = (node.prd_name || '').trim();
    const children = node.children || [];

    let statusIcon, statusColor, stockLabel;
    if (isLeaf) {
      if (stock === null || stock === undefined || stock === 0) {
        statusIcon = '❌'; statusColor = 'var(--orange)';
        stockLabel = short > 0 ? `缺 ${short}` : '无库存';
      } else {
        statusIcon = '✅'; statusColor = 'var(--green)';
        stockLabel = stock.toLocaleString();
      }
    } else {
      statusIcon = children.length ? '▶' : '·';
      statusColor = 'var(--sub)';
      stockLabel = '';
    }

    // 颜色：按层级渐变，越深越暖
    const depthColors = [
      '#4A90D9', // D0 成品 蓝
      '#6B8E6B', // D1 深绿
      '#4CAF50', // D2 绿
      '#E8A838', // D3 黄橙
      '#F4A261', // D4 橙
      '#E76F51', // D5 红
    ];
    const badgeColor = depthColors[Math.min(depth, depthColors.length - 1)];
    const kndLabel   = node.knd == '4'
      ? '<span style="font-size:10px;color:var(--sub);background:var(--bg2);padding:1px 5px;border-radius:3px">原料</span>'
      : '';
    const depthBadge = `<span style="font-size:10px;color:#fff;background:${badgeColor};padding:1px 5px;border-radius:3px;min-width:20px;text-align:center;display:inline-block">D${depth}</span>`;

    const hasChildren = children.length > 0;
    const toggleClass = hasChildren ? 'tree-toggle' : '';
    const toggleIcon  = hasChildren ? '<span class="tree-caret">▶</span>' : '<span style="display:inline-block;width:14px"></span>';

    const indent = depth * 16;

    let html = `
      <div class="tree-node" data-prd="${node.prd_no}" style="margin-bottom:2px">
        <div style="display:flex;align-items:${isLeaf?'center':'flex-start'};gap:6px;padding:6px 12px 6px ${12+indent}px;cursor:pointer;border-radius:6px"
             class="${toggleClass}"
             onclick="stockSearchByPRD('${node.prd_no}')">
          ${toggleIcon}
          ${depthBadge}
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-size:13px;font-weight:500;color:var(--text)">${fmt(node.prd_no)}</span>
              ${kndLabel}
              <span style="font-size:10px;color:var(--sub)">×${qty}</span>
            </div>
            ${name ? `<div style="font-size:13px;color:var(--name);margin-top:2px;word-break:break-all;white-space:normal">${fmt(name)}</div>` : ''}
          </div>
          ${isLeaf ? `<span style="font-size:13px;font-weight:700;color:${statusColor};white-space:nowrap;margin-left:8px">${statusIcon} ${stockLabel}</span>` : ''}
        </div>
        <div class="tree-children" style="display:none;margin-top:2px">`;
    for (const c of children) {
      html += renderNode(c, depth + 1);
    }
    html += `</div>
      </div>`;
    return html;
  }

  const tree = d.nested_tree || {};
  const treeHtml = tree.prd_no ? renderNode(tree, 0) : '<div style="padding:16px;text-align:center;color:var(--sub)">无 BOM 数据</div>';

  const html = `
    <div class="list">
      ${summary}
      <div class="smo-card" style="padding:8px 12px;margin-bottom:8px">
        <div style="font-size:12px;color:var(--sub);margin-bottom:4px">
          节点说明：<span style="color:var(--green)">✅</span>=有库存 &nbsp;
          <span style="color:var(--orange)">❌</span>=缺货 &nbsp;
          <span style="color:var(--sub)">▶</span>=点击展开 &nbsp;
          D0=成品 &nbsp; D3-D5=原料
        </div>
      </div>
      ${treeHtml}
      <div style="padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-cancel" onclick="expandAllTree()">📂 展开全部</button>
        <button class="btn-cancel" onclick="collapseAllTree()">📁 收起全部</button>
        <button class="btn-cancel" onclick="clearSearch()">← 清除搜索</button>
      </div>
    </div>`;

  el.innerHTML = html;
}

// 折叠/展开树节点
// 一键展开/收起全部 BOM 树
function expandAllTree() {
  document.querySelectorAll('.tree-children').forEach(el => el.style.display = '');
  document.querySelectorAll('.tree-caret').forEach(el => el.textContent = '▼');
}

function collapseAllTree() {
  document.querySelectorAll('.tree-children').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.tree-caret').forEach(el => el.textContent = '▶');
}

function hl(s) {
  if (!_suggestQ) return fmt(s);
  const q = _suggestQ.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(s).replace(new RegExp(`(${q})`, 'gi'), '<b style="color:var(--accent)">$1</b>');
}

// 搜索触发时用的本地过滤渲染
function renderCompletionListFiltered(filteredItems) {
  completionData = filteredItems;
  renderCompletionList();
}

function applyCompFilters() {
  compCustomer = ($id('compFCustomer') || {value:''}).value.trim();
  compDdjh     = ($id('compFDdjh')    || {value:''}).value.trim();
  compDdjhPlan = ($id('compFDdjhPlan') || {value:''}).value.trim();
  completionData = allCompletionData.filter(d => {
    if (compCustomer && !(d.cus||'').toLowerCase().includes(compCustomer.toLowerCase())) return false;
    if (compDdjh    && !(d.ref||'').toLowerCase().includes(compDdjh.toLowerCase()))    return false;
    if (compDdjhPlan && !(d.ddjh||'').toLowerCase().includes(compDdjhPlan.toLowerCase())) return false;
    if (compWh && (d.wh1_name||d.wh1||'') !== compWh) return false;
    return true;
  });
  renderCompletionList();
}

function resetCompFilters() {
  compCustomer = ''; compDdjh = ''; compDdjhPlan = ''; compWh = '';
  completionData = allCompletionData;
  renderCompletionList();
}

function filterByWh(wh) {
  compWh = wh;
  completionData = compWh
    ? allCompletionData.filter(d => (d.wh1_name||d.wh1||'') === compWh)
    : allCompletionData;
  renderCompletionList();
}

// 点击调拨单（材料）→ 查哪些成品用了它，显示材料状态，可加到完工列表
async function openCompletionModal(icNo, prdNo) {
  const matPrd = prdNo;
  toast('查询成品…');

  // 查 bom_match：哪些成品用了这个材料
  let matchData, matchErr = null;
  try {
    matchData = await api(BASE + '/completion/bom_match?' + new URLSearchParams({prd_no: matPrd}));
  } catch(e) { matchData = {items: []}; matchErr = e; }
  const matches = matchData.items || [];
  if (!matches.length) {   // Step A：区分"查不到"和"请求失败"（原来都提示无成品使用此材料）
    toast(matchErr ? ('❌ 查询失败: ' + matchErr.message) : '⚠️ 无成品使用此材料');
    return;
  }

  // 批量查每个成品的材料详情
  const fgDetails = [];
  let fgFail = 0;   // Step A：原来 catch(e){} 空吞，用户看到的是"无匹配"
  for (const m of matches) {
    try {
      const d = await api(BASE + '/completion/fg_detail?' + new URLSearchParams({fg_no: m.prd_no}));
      fgDetails.push(d);
    } catch(e) { fgFail++; }
  }
  if (fgFail) toast('⚠️ ' + fgFail + ' 个成品的材料详情加载失败');

// 实时重算弹窗内某项成品的 BOM 需用量
function bomRecalc(idx) {
  const _qi = parseInt(document.getElementById('clQ_' + idx)?.value);
  const qty = isNaN(_qi) ? 0 : _qi;   // 空 = 未填（不再静默按 1）
  completionList[idx].fg_qty = qty;
  const item = completionList[idx];
  const wh = (document.getElementById('clWh_' + idx)?.value || item.fg_wh || 'G');
  completionList[idx].fg_wh = wh;
  // Update each BOM sub-row need/ok cell
  document.querySelectorAll('[data-item-idx="' + idx + '"]').forEach(row => {
    const prdNo = row.getAttribute('data-prd');
    const m = item.bom?.find(x => x.prd_no === prdNo);
    if (!m) return;
    const ratio = m.qty_per_unit || 0;
    const need = Math.ceil(ratio * qty);
    const avail = (m.transfers || []).reduce((s, t) => s + Number(t.available || 0), 0);  // 全部调拨单剩余相加，不分仓
    const ok = avail >= need;
    const needCell = row.querySelector('.bom-need');
    const okCell = row.querySelector('.bom-ok');
    if (needCell) needCell.textContent = qty > 0 ? need : '—';
    if (okCell) {
      if (qty > 0) {   // 数量未填 → 不显示 ✅（否则 need=0 全绿会被误读成"料都够"）
        okCell.textContent = ok ? '\u2705' : '\u274c';
        okCell.style.color = ok ? '#16a34a' : '#dc2626';
      } else {
        okCell.textContent = '—';
        okCell.style.color = '#9ca3af';
      }
    }
  });
}

// 批量完工：可用量 = 该材料所有调拨单剩余之和（不分仓，有剩余就能用，MAK 2026-09-30）。
// 记账只挂一张调拨单：优先用户点的那张（能覆盖需用量时），否则取剩余最多的那张。
// ponytail: 单张不够时会把那一单扣穿、别的单剩余不动；要精确分摊得改成一行挂多张单，暂不需要。
function compSumAvail(m) {
  return (m.transfers || []).reduce((s, t) => s + Number(t.available || 0), 0);
}
function compPickTransfer(m, need, preferIcNo) {
  const cand = (m.transfers || []).filter(t => Number(t.available || 0) > 0)
    .sort((a, b) => Number(b.available || 0) - Number(a.available || 0));
  return cand.find(t => t.ic_no === preferIcNo && Number(t.available || 0) >= need) || cand[0];
}

      toast('\u274c \u6750\u6599\u5e93\u5b58\u4e0d\u8db3\uff1a' + detail + (shortItems.length > 3 ? '\u2026' : ''));
      btn.disabled = false; btn.textContent = '\u786e\u8ba4\u5b8c\u5de5';
      return;
    }

    // 3. Collect tools
    const toolRows = [];
    document.querySelectorAll('#cmToolArea > div').forEach(row => {
      const sel = row.querySelector('select');
      const inp = row.querySelector('input');
      if (sel && sel.value && inp && parseInt(inp.value) > 0) {
        toolRows.push({code: sel.value, qty: parseInt(inp.value)});
      }
    });

    // 4. Build items
    const items = completionList.map(item => {
      const wh = item.fg_wh || 'G';
      const bom = item.bom || [];
      const materials = bom.map(m => {
        const need = Math.ceil((m.qty_per_unit || 0) * (item.fg_qty || 0));
        const tRow = compPickTransfer(m, need, item.transfer_ic_no);
        return {
          prd_no: m.prd_no,
          ratio: m.qty_per_unit || 0,
          transfer_ic_no: tRow ? (tRow.ic_no||'') : '',
          transfer_wh1: tRow ? (tRow.wh1||'') : '',
          ddjh: item.ddjh || '',
          customer: item.customer || '',
        };
      });
      return {
        fg_no: item.fg_no,
        qty: item.fg_qty,
        dzhw: item.danzhong||0,
        jzhw: item.jingzhong||0,
        ref: item.ref||'',
        customer: item.customer||'',
        ddjh: item.ddjh||'',
        materials,
      };
    });

    try {
      const res = await api(BASE + '/completion/batch', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({items, fg_wh: (document.getElementById('cm_wh_in')||{value:'G'}).value.trim() || 'G', tool_rows: toolRows})
      });
      if (res.ok) {
        toast('\u2705 \u5b8c\u5de5成\u529f\uff08\u5165\u5e93:' + (res.ic_in||'') + ' \u51fa\u5e93:' + (res.ic_out||'') + '\uff09');
        overlay.remove();
        completionList = [];
        loadCompletion();
      } else {
        toast('\u274c ' + (res.error||JSON.stringify(res)));
        btn.disabled = false; btn.textContent = '\u786e\u8ba4\u5b8c\u5de5';
      }
    } catch(e) {
      toast('\u274c ' + e.message);
      btn.disabled = false; btn.textContent = '\u786e\u8ba4\u5b8c\u5de5';
    }
  };
}

async function loadTransfer() {
  const el = $id('content');
  el.innerHTML = `
    <div class="list">
      <div style="padding:4px 0 8px">
        <div style="font-size:13px;color:var(--sub);margin-bottom:6px">

        </div>
      </div>
    </div>`;
  stockData = null;
  stockSuggestions = [];
  // 预加载所有仓库供调拨弹窗使用
  (async () => {
    try {
      const res = await api(BASE + '/warehouses/all');
      window.__allWarehouses = res.warehouses || res.items || res || [];
    } catch(e) {
      // Step A：原来静默置空（弹窗仓库下拉空白，无任何提示）

          inp.value = first.prd_no;

async function loadStockSuggestions(q) {
  _suggestQ = q;
  try {
    const res = await api(BASE + '/product/search?' + new URLSearchParams({q}));
    stockSuggestions = res.products || [];
    renderSuggestions();
  } catch(e) {
    dismissSuggestions();
    // Step A：原来完全静默。打字时每次请求都失败会刷屏 → 同类提示 5 秒内只报一次
    var now = Date.now();
    if (!window.__suggestErrAt || now - window.__suggestErrAt > 5000) {
      window.__suggestErrAt = now;
      toast('⚠️ 商品搜索失败: ' + e.message);
    }
  }
}

function renderSuggestions() {
  // 删除旧列表
  const old = document.getElementById('stockSuggestions');
  if (old) old.remove();
  if (!stockSuggestions.length) return;

  const inp = $id('searchInput');
  if (!inp) return;
  const rect = inp.getBoundingClientRect();

  const wrap = document.createElement('div');
  wrap.id = 'stockSuggestions';
  wrap.style.cssText = `
    position:fixed; left:${rect.left}px; top:${rect.bottom + 4}px;
    width:${rect.width}px; max-height:260px; overflow-y:auto;
    background:#fff; border:1px solid var(--border); border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.15); z-index:500;

  for (const p of stockSuggestions.slice(0, 8)) {

    div.innerHTML = `<b>${hl(p.prd_no)}</b> <span style="color:var(--name)">${hl(p.name||'')}</span>`;
    div.onmouseenter = () => div.style.background = '#f5f5f5';

      $id('searchInput').value = prd;

      if (curTab === 'smo') {
        smoSearchByPRD(prd);

}

// ── 调拨 BOM 懒加载（C 步）──────────────────────────────────
// 缓存 prd_no → nested_tree；提交成功后失效（见 doInOut/doTransfer/bomBatchConfirm）
let bomTreeCache = {};

// ponytail: 表头与表体列宽一致，品号列收窄
function bomTreeHeaderHtml() {
  return `<div style="display:flex;align-items:center;height:32px;background:var(--bg);border-bottom:2px solid var(--border);padding:0 12px;font-size:11px;color:var(--sub);font-weight:600">

        <span style="width:40px;flex-shrink:0;text-align:center">层级</span>

        <span style="width:60px;flex-shrink:0;text-align:right;margin-right:8px">配比</span>
        <span style="width:60px;flex-shrink:0;text-align:right;margin-right:8px">库存</span>
        <span style="flex:1;min-width:0">名称</span>
      </div>`;
}

// 加载/重画调拨 BOM 树：命中缓存 0 请求直接画；未命中才请求（C3 起由 renderStock 搜完自动调用）
async function loadTransferBom(prdNo) {
  const area = $id('bomChildrenOfTransfer');
  if (!area) return;
  if (prdNo in bomTreeCache) {   // 命中缓存：0 请求直接画（提交后重画也走这里）
    const t = bomTreeCache[prdNo];
    area.innerHTML = t
      ? bomTreeHeaderHtml() + renderTransferBomTree(t)
      : '<div style="padding:12px;font-size:12px;color:var(--sub)">无 BOM 结构</div>';
    updateBOMSelected();   // 重画不触发 change 事件 → 手动刷新「已选 N 项」
    return;
  }
  area.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:var(--sub)">加载 BOM…</div>';
  try {
    const bd = await api(BASE + '/smo/bom_stock?' + new URLSearchParams({fg_no: prdNo, include_tree: '1'}));
    const tree = bd.nested_tree;
    bomTreeCache[prdNo] = tree || null;
    const area2 = $id('bomChildrenOfTransfer');
    if (!area2) return;
    if (!tree) { area2.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--sub)">无 BOM 结构</div>'; return; }
    area2.innerHTML = bomTreeHeaderHtml() + renderTransferBomTree(tree);
    updateBOMSelected();   // 重画不触发 change 事件 → 手动刷新「已选 N 项」
  } catch(e) {
    // ponytail: 失败不写缓存，下次搜索会重试
    const area3 = $id('bomChildrenOfTransfer');
    if (area3) area3.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--red)">加载 BOM 失败</div>';
  }
}

// BOM树渲染函数（checkbox 勾选 + 纯展示，与 PMC 列表样式一致）
function renderTransferBomTree(node, depth = 0) {
  const prdNo = node.prd_no;
  const knd = node.knd || '4';
  const isRoot = depth === 0;
  // ponytail: 使用与 PMC 一致的层级颜色徽章
  const depthColors = ['#1d4ed8','#16a34a','#d97706','#ea580c','#dc2626'];
  const depthColor = depthColors[Math.min(depth, depthColors.length-1)] || '#1d4ed8';
  const depthLabel = isRoot ? '成品' : 'L' + depth;
  const qty = node.qty_per_unit != null ? node.qty_per_unit.toFixed(5) : '1.00000';
  const stock = node.stock != null ? node.stock.toFixed(1) : '—';
  const stockColor = node.is_ready ? 'var(--green)' : 'var(--red)';
  const isSelected = (window.__curStockPrdNo && bomSelectedByProduct[window.__curStockPrdNo] && bomSelectedByProduct[window.__curStockPrdNo][prdNo]) ? true : false;
  const rowKey = prdNo + '|' + depth;

  let html = `<div style="
    display:flex;align-items:center;height:32px;
    padding:0 12px;
    border-bottom:1px solid var(--border);
    font-size:12px;
    ${isRoot ? 'font-weight:700;background:#dbeafe;' : 'font-weight:400;'}
    ${isSelected ? 'background:#EEF6FF;' : ''}
  " data-key="${rowKey}" data-prd="${prdNo}" data-name="${htmlJsonEscape(node.prd_name||'')}" data-qty="${qty}" data-stock="${stock}" data-depth="${depth}" onclick="bomRowClick(this)">
    <span style="width:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center">
      <input type="checkbox" class="bom-row-check" ${isSelected ? 'checked' : ''} onchange="updateBOMSelected()" style="cursor:pointer">
    </span>
    <span style="width:40px;flex-shrink:0;text-align:center">
      <span style="font-size:10px;font-weight:700;color:#fff;background:${depthColor};padding:2px 6px;border-radius:10px">${depthLabel}</span>
    </span>
    <span style="width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${isRoot?'700':'500'};margin-right:8px">${fmt(prdNo)}</span>
    <span style="width:60px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;margin-right:8px">${qty}</span>
    <span style="width:60px;flex-shrink:0;text-align:right;font-weight:600;color:${stockColor};font-variant-numeric:tabular-nums">${stock}</span>
    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--name);font-size:13px;margin-left:8px">${fmt(node.prd_name||'')}</span>
  </div>`;

  if (node.children) {
    node.children.forEach(child => {
      html += renderTransferBomTree(child, depth + 1);
    });
  }
  return html;
}

// 存储完整的 BOM 行数据（含母件品号）
let bomSelectedByProduct = {};
// { parentPrd_no -> { childPrd_no -> { prd_no, prd_name, wh_stock, qty_per_unit, parentPrd_no, parentPrdName } } }
// 记录 BOM 弹窗表单值的全局存储 { prd_no_parent -> { rowKey -> { ref, ddjh, wh_from, qty, dz, jz } } }
let batchFormData = {};

// 事件委托：全局监听 BOM 勾选，页面加载时绑定一次即可
document.addEventListener('change', (e) => {
  if (e.target.classList.contains('bom-row-check')) {
    updateBOMSelected();
  }
  if (e.target.id === 'bomCheckAll') {
    const checked = e.target.checked;
    document.querySelectorAll('.bom-row-check').forEach(cb => { cb.checked = checked; });
    updateBOMSelected();
  }
});

// BOM 行点击：切换勾选 + 更新已选
function bomRowClick(div) {
  const cb = div.querySelector('.bom-row-check');
  if (!cb) return;
  cb.checked = !cb.checked;
  updateBOMSelected();
}

function updateBOMSelected() {
  const checks = document.querySelectorAll('.bom-row-check:checked');
  const curPrd = window.__curStockPrdNo || '';
  if (!curPrd) return;

  if (!bomSelectedByProduct[curPrd]) bomSelectedByProduct[curPrd] = {};
  // 先清当前产品的选择
  bomSelectedByProduct[curPrd] = {};
  checks.forEach(cb => {
    const div = cb.closest('[data-key]');
    if (!div) return;
    const prdNo = div.dataset.prd || '';
    if (!prdNo) return;
    const row = {
      prd_no: prdNo,
      prd_name: div.dataset.name || '',
      qty_per_unit: parseFloat(div.dataset.qty) || 0,
      qty: parseFloat(div.dataset.stock) || 0,
      parentPrdNo: curPrd,
      parentPrdName: window.__curStockPrdName || '',
    };
    bomSelectedByProduct[curPrd][prdNo] = row;
  });

  // 总已选数（跨所有产品）
  let totalN = 0;
  Object.values(bomSelectedByProduct).forEach(m => { totalN += Object.keys(m).length; });

  const countWrap = $id('bomBatchCountWrap');
  const countEl = $id('bomBatchCount');
  if (countWrap) countWrap.style.display = totalN ? '' : 'none';
  if (countEl) countEl.textContent = totalN;
}

function pmcToggleSel(soNoItm, prdNo) {
  // ⚠ 曾经是 pmcToggleSel(key, idx) + 卡片只传一个下标 → idx=undefined → items[NaN] → 直接 return，
  //   勾选框点了完全没反应，底部「批量预览/生成 MPS」永不出现。按品号身份查，搜索筛选后也不怕错位。
  var items = window.__pmcItems || [];
  var t = items.filter(function(x) {
    return (x.so_no_itm || '') === (soNoItm || '') && (x.prd_no || x.PRD_NO || '') === (prdNo || '');
  })[0];
  if (!t) return;
  // pmcSelected is an array: [{so_no_itm, prd_no, qty}]
  var exists = pmcSelected.findIndex(function(x) {
    return (x.so_no_itm||'') === (t.so_no_itm||'') && (x.prd_no||'') === (t.prd_no||t.PRD_NO||'');
  });
  if (exists >= 0) {
    pmcSelected.splice(exists, 1);
  } else {
    pmcSelected.push({
      so_no_itm: t.so_no_itm||'',
      so_no: t.os_no||t.SO_NO||'',
      prd_no: t.prd_no||t.PRD_NO||'',
      qty: parseFloat(t.qty||t.QTY||0)
    });
  }
  renderPMCList(items, $id('pmcSearch') ? $id('pmcSearch').value : '');
}

window.__pmcSearchFn = function(q) {
  renderPMCList(window.__pmcItems || [], q);
};

// ── PMC 批量提交（旧版）──────────────────────────────────────────────
async function pmcSubmit() {
  if (!pmcSelected || !pmcSelected.length) {
    alert('\u8bf7\u5148\u52fe\u9009\u6307\u4ee4\u5355');
    return;
  }
  var el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>\u751f成 MPS \u4e2d\u2026</div>';
  try {
    var res = await api(BASE + '/pmc/generate_mps', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items: pmcSelected})
    });
    if (res.error) { el.innerHTML = '<div class="error-msg">' + res.error + '</div>'; return; }
    var results = res.results || (res.mps_no ? [res] : []);
    var mpsList = results.map(function(r) { return r.mps_no; }).filter(Boolean).join(' / ') || res.mps_no || '\u2014';
    var totalItm = results.reduce(function(s, r) { return s + (r.total_itm || 0); }, 0);
    el.innerHTML = '<div style="padding:20px;text-align:center"><div style="font-size:16px;font-weight:600;color:var(--green);margin-bottom:8px">✓ MPS \u751f成\u5b8c成</div><div style="font-size:14px;word-break:break-all">' + mpsList + '</div><div style="font-size:13px;color:var(--sub);margin-top:6px">' + results.length + ' \u5f20\u5de5\u5355 \u00b7 ' + totalItm + ' \u4e2a\u9879\u6b21</div><div style="margin-top:16px"><button onclick="loadPMC()" style="padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer">\u7ee7\u7eed\u5206\u6790</button></div></div>';
  } catch(e) { el.innerHTML = '<div class="error-msg">' + e.message + '</div>'; }
}

// PMC 批量预览（BOM 树合并）
async function pmcPreviewBatch() {
  if (!pmcSelected || !pmcSelected.length) { alert('\u8bf7\u5148\u52fe\u9009\u6307\u4ee4\u5355'); return; }
  var el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>加载中\u2026</div>';
  var allRows = [];
  try {
    // 一次请求跑完整批：材料仓 / 别人多下跨单只抵一次 —— 跟生成 MPS 落库同一套规则
    // （以前是逐单各请求一次、每单各抵一遍同一批库存，逐行缺口相加毫无意义）
    var data = await api(BASE + '/pmc/preview_batch', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items: pmcSelected})
    });
    allRows = (data && data.items) || [];
    // ⚠ 调整弹窗(pmcOpenAdjust)从 __pmcBomRows 里取该料的仓库明细 —— 批量预览以前没设这个
    //    变量，导致「调整」按钮全弹「该品号无原材料仓库存」（MAK 2026-09-30 报）
    window.__pmcBomRows = allRows;
    window.__pmcQdCtx = null;   // 合并树没有单一 SO 行 → 不提供请购生成
    renderPMCTree(allRows, '合并 ' + pmcSelected.length + ' 条指令单');
  } catch(e) { el.innerHTML = '<div class="error-msg">' + e.message + '</div>'; }
}

// PMC 批量生成
// PMC 单行分析 → BOM 树
async function pmcAnalyzeRow(soNoItm, prdNo, qty) {
  var el = $id('content');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>加载中\u2026</div>';
  try {
    var data = await api(BASE + '/pmc/preview_mps?' + new URLSearchParams({so_no_itm: soNoItm, prd_no: prdNo, qty: qty}));
    if (data.error) { el.innerHTML = '<div class="error-msg">' + data.error + '</div>'; return; }
    var items = data.items || [];
    // 保存 BOM 行供调整弹窗用
    window.__pmcBomRows = items;
    window.__pmcPending = {soNoItm: soNoItm, prdNo: prdNo, qty: qty};
    // 请购上下文：只有「单张单」的树才能生成请购单（合并树没有单一 SO 行，挂不上指令单号/客户）
    window.__pmcQdCtx = {so_no_itm: soNoItm, fg_no: prdNo, qty: qty};
    renderPMCTree(items, soNoItm + ' ' + prdNo);
  } catch(e) { el.innerHTML = '<div class="error-msg">' + e.message + '</div>'; }
}

// PMC BOM 树渲染
function renderPMCTree(items, title) {
  var el = $id('content');
  if (!items || !items.length) { el.innerHTML = '<div class="state-msg">\u65e0 BOM 数据</div>'; return; }
  window.__pmcTreeItems = items;   // 生成请购单要按行取品号/数量
  gnEnsureMap();   // 懒加载全厂净需求（slim）→ 回来只回填缺口格下方那行小字，不重渲染
  var fgRow = items.find(function(r) { return r.is_fg; });
  var bomRows = items.filter(function(r) { return !r.is_fg; });

  var html = '<div style="padding:12px">';
  html += '<div style="margin-bottom:12px"><button onclick="loadPMC()" style="background:#6b7280;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px">\u2190 \u8fd4\u56de\u5217\u8868</button></div>';
  // 页头 = 全厂净需求合计（本树涉及的品号去重累加；成品行的 gross_plant 不计入——成品未出 ≠ 料净需求）
  var summaryTag = fgRow ? '<span id="gnTotalSpan">' + gnTotalTagHtml() + '</span>' : '';
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap"><div style="font-size:13px;color:var(--sub)">' + (title||'') + '</div>' + summaryTag + matSumTag() + '</div>';

  // BOM 展开明细
  html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:1330px"><thead><tr style="background:#f3f4f6">';
  html += '<th style="padding:8px 10px;text-align:left;min-width:240px">品号</th>';
  html += '<th style="padding:8px 8px;text-align:center;white-space:nowrap;min-width:64px">层</th>';
  html += '<th style="padding:8px 8px;text-align:right;white-space:nowrap;min-width:96px">需求</th>';
  html += '<th style="padding:8px 8px;text-align:right;white-space:nowrap;min-width:104px">原材料仓</th>';
  html += '<th style="padding:8px 8px;text-align:right;white-space:nowrap;min-width:96px">生产仓</th>';
  html += '<th style="padding:8px 8px;text-align:right;white-space:nowrap;min-width:104px">在途采购</th>';

  html += '<th style="padding:8px 8px;text-align:right;white-space:nowrap;min-width:160px" title="全厂口径：所有成品未出展开 − 材料仓 − 生产仓 − 在途 − 请购（料行）；成品行显示全厂未出（所有订单）">全厂净需求</th>';
  html += '<th style="padding:8px 8px;text-align:center;white-space:nowrap;min-width:170px" title="勾选原材料 + 填数量 → 生成请购单（QD）。数量默认填品号净缺口，没有则填本行缺口，都可以改">请购</th>';
  html += '<th style="padding:8px 8px;text-align:center;white-space:nowrap;min-width:80px">调整</th>';

  var depthColors = ['#1d4ed8','#16a34a','#d97706','#ea580c','#dc2626'];

  // 同一张 MPS 里同品号会重复出现（照 ERP 粒度，不合并行）；库存只抵一次（排产口径），

  // 函数声明会提升 → 表头（比下面 depthColors 那行更早拼）也能叫它们，不用把整块搬上去
  var matAggCache = null, matSeen = {};
  function matAggOf() {
    if (matAggCache) return matAggCache;
    var agg = {};
    for (var mi = 0; mi < items.length; mi++) {
      var mr = items[mi];
      if (mr.is_fg) continue;
      var mp = mr.prd_no || '';
      var mgross = (mr.gross_plant === undefined || mr.gross_plant === null) ? (mr.gross_demand || 0) : mr.gross_plant;
      var mpool = (mr.pool_total === undefined || mr.pool_total === null) ? ((mr.pool_way || 0) + (mr.pool_odr || 0)) : mr.pool_total;
      if (!agg[mp]) agg[mp] = { n: 0, gross: 0, mat: mr.mat_qty || 0, pool: mpool, own: 0, real: 0 };
      agg[mp].n++;
      agg[mp].gapSum = (agg[mp].gapSum || 0) + (mr.gap || 0);
      agg[mp].gross += mgross;
      // ⚠ 不能用 real_demand || gap：需求真的是 0 的行会退化成负数缺口，合并需求就成负数了
      agg[mp].real += (mr.real_demand === undefined || mr.real_demand === null) ? (mr.gap || 0) : mr.real_demand;
      agg[mp].own = Math.max(agg[mp].own, (mr.qty_on_way || 0) + (mr.qty_on_odr || 0));
    }
    matAggCache = agg;
    return agg;
  }
  function matSumTag() {
    var agg = matAggOf(), repPrd = 0, repReal = 0;
    for (var mpk2 in agg) {
      if (agg[mpk2].n < 2) continue;
      repPrd++; repReal += agg[mpk2].real;
    }
    return repPrd > 0
      ? '<span style="background:#eef2ff;color:#4338ca;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600" title="' +

        '">同料去重 ' + repPrd + ' 个品号 · 合并需求 ' + Number(repReal).toLocaleString('zh-CN') + '</span>'
      : '';
  }
  function matBadgeHtml(prd) {
    var a = matAggOf()[prd];

    matSeen[prd] = (matSeen[prd] || 0) + 1;
    if (matSeen[prd] === 1) {
      return '<span style="margin-left:6px;background:#eef2ff;color:#4338ca;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600" title="' +
        escAttr('该料在本次选中的单里共 ' + a.n + ' 处：需求合计 ' + Number(a.real).toLocaleString('zh-CN') +
                (a.gross ? '（全厂毛需求 ' + Number(a.gross).toLocaleString('zh-CN') + '）' : '') +

        '">同料 ' + a.n + ' 处 · 合并需求 ' + Number(a.real).toLocaleString('zh-CN') +
        (a.mat > 0 ? ' · 库存 ' + Number(a.mat).toLocaleString('zh-CN') + ' 只抵一次' : '') + '</span>';

  // 全厂净需求：同品号本树第 2 次起不显示数字（跟 matBadgeHtml 同一套「首次出现」规则）

        (ownOdr > 0 ? '' : '（都是别的单请的，不是本单的）') +

    html += '<tr data-gnrow="' + escAttr(r.prd_no || '') + '"' + (isFg ? ' data-gnfg="1"' : '') +
      ' style="border-bottom:1px solid #f3f4f6;background:' + bg + '">';
    html += '<td style="padding:8px 10px"><div style="max-width:min(44vw,760px);white-space:normal;overflow-wrap:anywhere" title="' + escAttr((r.prd_no||'') + ' ' + (r.prd_name||'')) + '"><span style="display:inline-block;margin-left:' + indent + 'px"></span><b style="font-variant-numeric:tabular-nums">' + escHtml(r.prd_no||'') + '</b> <span style="font-size:13px;color:var(--name)">' + escHtml(r.prd_name||'') + '</span>' + matBadgeHtml(r.prd_no||'') + '</div></td>';
    html += '<td style="padding:8px 8px;text-align:center;white-space:nowrap"><span style="font-size:10px;font-weight:700;color:#fff;background:' + depthColor + ';padding:2px 5px;border-radius:10px">' + depthLabel + '</span></td>';
    html += '<td data-gnreq="' + escAttr(r.prd_no||'') + '" style="padding:8px 8px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap" title="' + escAttr(
      '本单需求 ' + Number(realDemand).toLocaleString('zh-CN') + '（父件缺口×配比往下推）\n全厂毛需求 ' + Number(grossAll).toLocaleString('zh-CN') +
      '（该成品全部未出展开；毛数不扣库存/在途；成品行=该成品全厂未出，料行=按它展开到本料的量）\n' +
      '本单可用合计（本单可用在途 + 挂本单在单请购）：' + Number(wayFree + ownOdr).toLocaleString('zh-CN')) + '">' + Number(realDemand).toLocaleString('zh-CN') + '</td>';

    html += '<td style="padding:8px 8px;text-align:right;color:#16a34a;font-variant-numeric:tabular-nums;white-space:nowrap" title="\u751f\u4ea7\u4ed3\uff08\u8f66\u95f4\u4ed3/\u5916\u53d1\u4ed3\uff09\u5df2\u88ab\u9886\u53bb\u505a\u522b\u7684\u5355\uff0c\u4e0d\u53c2\u4e0e\u7f3a\u53e3\u8ba1\u7b97\uff1b\u4e0d\u53ef\u8c03\u6574">' + Number(prodQty).toLocaleString('zh-CN') + '</td>';

  html += '<span>全厂净需求=<span style="color:#b45309;font-weight:600">所有成品的未出展开 − 材料仓 − 生产仓 − 在途 − 请购</span>（全厂口径，hover 看明细；同品号只在第一处显示，跟左边的「缺口」不是一回事）</span>';
  html += '</div>';

  // 生成请购单（只从单张单的树进入；合并树没有单一 SO 行）
  if (fgRow && window.__pmcQdCtx && window.__pmcQdCtx.so_no_itm) {
    html += '<div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:#f9fafb;border:1px solid var(--border);border-radius:8px">' +
      '<span style="font-size:13px;font-weight:600">生成请购单</span>' +
      '<label style="font-size:13px;display:flex;align-items:center;gap:6px">交期 <input type="date" id="qdEstDd" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px"></label>' +

      '</div>';

  // 生成 MPS 按钮
  if (fgRow) {
    html += '<div style="margin-top:16px"><button onclick="pmcSubmit()" style="background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer">\u751f成 MPS</button></div>';
  }

  html += '</div>';
  el.innerHTML = html;

// ── PMC 生成请购单（原材料 → QTS / QD 单）────────────────────────────────────
// 流程：树里勾「请购」列 + 填数量 → 交期（手填）→ 一键生成
//   ① 先用 dry=1 跑一遍（后端做完所有校验和 INSERT 后 ROLLBACK）→ 把「将写入什么」摊在确认弹窗里
//   ② 确认后再真写（一张 QD 单，多行 ITM）
function pmcQdCollect() {
  var out = [], items = window.__pmcTreeItems || [];
  for (var i = 0; i < items.length; i++) {
    var cb = $id('qdSel_' + i);
    if (!cb || !cb.checked) continue;
    var qi = $id('qdQty_' + i);
    var q = qi ? parseFloat(qi.value) : 0;
    if (!(q > 0)) continue;

  var matDetail = (row && row.mat_detail) ? row.mat_detail : [];
  if (!matDetail.length) {
    // 说清「为什么不能调」，别只丢一句「没库存」：这料可能在生产仓有货、或者全厂一条库存记录都没有
    var pd = (row && row.prod_detail) ? row.prod_detail : [];
    var other = pd.map(function(x) { return (x[0] || '') + ' ' + (x[1] || '') + ' ' + (x[2] || 0); }).join('；');

          (other ? '\n（它在生产仓/别的仓有货：' + other + ' —— 那部分已被领走，不在这里调）' : '\n（全厂没有任何仓库有它的库存记录）'));
    return;
  }

  var whOpts = matDetail.map(function(m) {
    return '<option value="' + m[0] + '">' + m[0] + ' ' + (m[1]||'') + ' (' + (m[2]||0) + ')</option>';
  }).join('');

  overlay.innerHTML = '<div style="background:var(--card);border-radius:16px;width:90%;max-width:400px;padding:20px;font-family:inherit">' +
    '<div style="font-size:16px;font-weight:600;margin-bottom:14px">调\u6574\u5e93\u5b58 <b>' + escHtml(prdNo) + '</b></div>' +

      return '<div style="padding:6px 8px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:12px">' +
        '<b>' + (m[0]||'') + '</b> ' + (m[1]||'') + ': <b>' + (m[2]||0) + '</b></div>';
    }).join('') + '</div>' +

    '<div style="margin-bottom:14px"><label style="font-size:13px;color:var(--sub);display:block;margin-bottom:4px">调\u6574\u540e\u6570\u91cf</label>' +
    '<input id="pmcAdjQtyInput" type="number" step="0.01" min="0" value="" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box"></div>' +
    '<div style="display:flex;gap:8px"><button onclick="document.getElementById(\'pmcAdjOverlay\').remove()" style="flex:1;padding:10px;background:#6b7280;color:#fff;border:none;border-radius:6px;cursor:pointer">\u53d6\u6d88</button>' +
    '<button onclick="doPmcAdjust(\'' + escAttr(prdNo) + '\')" style="flex:1;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">\u786e\u8ba4调\u6574</button></div>' +

// 切换目标仓库 → 数量框重置为该仓当前库存（避免把 A 仓的数量当作 B 仓的调整后数量提交）
function pmcAdjWhChange() {
  var wh = $id('pmcAdjWhSelect').value;
  var m = (window.__pmcAdjMat || []).find(function(x) { return x[0] === wh; });
  var inp = $id('pmcAdjQtyInput');
  if (inp && m) inp.value = m[2] || 0;   // 找不到就不动（手输错码不要把数量框清成 0）
}

// PMC 确认调整
async function doPmcAdjust(prdNo) {
  var wh = $id('pmcAdjWhSelect').value;
  var _rawQty = String(($id('pmcAdjQtyInput') || {value:''}).value).trim();
  var qty = parseFloat(_rawQty);
  // 空 = 忘了填 → 拦；显式 0 = 清仓 → 放行（后端会出库整仓库存，这是合法意图）
  if (!wh || _rawQty === '' || isNaN(qty) || qty < 0) { alert('请填写仓库和调整后数量（0 = 清仓，留空 = 未填）'); return; }
  if (!(window.__pmcAdjMat || []).some(function(x) { return x[0] === wh; })) { alert('⚠️ 仓码不在该料的仓库列表里：' + wh); return; }
  var m = (window.__pmcAdjMat || []).find(function(x) { return x[0] === wh; });
  var currentQty = m ? (parseFloat(m[2]) || 0) : 0;   // 后端契约要 current_qty，否则它按 0 算 → 判定"无需调整"
  try {
    var res = await api(BASE + '/pmc/adjust_stock', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prd_no: prdNo, wh: wh, input_qty: qty, current_qty: currentQty})
    });
    if (res && res.error) { alert(res.error); return; }
    if (res && res.ok) toast('\u2705 ' + (res.msg || ('\u5df2\u8c03\u6574 ' + prdNo + ' ' + wh + ' \u2192 ' + qty)) + (res.ic_no ? ' ' + res.ic_no : ''));
    document.getElementById('pmcAdjOverlay').remove();
    // 刷新当前 BOM 树
    var p = window.__pmcPending;
    if (p) { pmcAnalyzeRow(p.soNoItm, p.prdNo, p.qty); }
  } catch(e) { alert('\u8c03\u6574\u5931\u8d25: ' + e.message); }
}

  $id('in_qty').addEventListener('input', calcInJZ);
  $id('in_dz').addEventListener('input', calcInJZ);
}

// 单重(g) × 数量 ÷ 1000 = 净重(kg)：三处 payload 共用一处算法，避免各写各的精度/兜底
function calcJZ(q, d) {
  var n = (parseFloat(q) || 0) * (parseFloat(d) || 0) / 1000;
  return n > 0 ? +n.toFixed(3) : 0;
}

// 净重显示：算不出（单重或数量为空）→ "—"；否则 "0.092 kg"（与批量调拨/盘点/单笔调拨同一风格）
function fmtJZ(q, d) {
  var n = calcJZ(q, d);
  return n > 0 ? n.toFixed(3) + ' kg' : '—';
}

// 批量完工弹窗：数量/单重任一变动 → 重算该行净重（净重只读，不可手改，避免漏填/填错）
function calcCompJZ(i) {
  var q = parseFloat(($id('clQ_' + i) || {value:''}).value) || 0;
  var d = parseFloat(($id('clDz_' + i) || {value:''}).value) || 0;
  var el = $id('clJz_' + i);
  if (el) el.textContent = fmtJZ(q, d);
}

function calcInJZ() {
  var q = parseFloat($id('in_qty').value) || 0;
  var d = parseFloat($id('in_dz').value) || 0;
  var el = $id('in_jz_val');
  if (el) el.textContent = q > 0 && d > 0 ? (q * d / 1000).toFixed(3) + ' kg' : '\u2014';
}

// 统一的入库/出库提交
async function doInOut(prd_no, wh, mode) {
  const isIn = mode === 'in';
  const wh1 = isIn ? (($id('in_wh')||{value:''}).value.trim() || wh) : wh;
  const wh2 = isIn ? '' : (($id('in_wh')||{value:''}).value.trim() || wh);
  const inQty = parseFloat(($id('in_qty')||{value:'0'}).value) || 0;
  if (isIn && !wh1) { toast('⚠️ 请选择仓库'); return; }
  if (inQty <= 0) { toast('⚠️ 数量必须大于 0'); return; }

  const row = {
    prd_no, qty: inQty, wh: isIn ? wh1 : wh2,
    ref_itm: ($id('in_ref')||{value:''}).value.trim(),
    ddjh: ($id('in_ddjh')||{value:''}).value.trim(),
    sup_name: ($id('in_sup')||{value:''}).value.trim(),
    danzhong: parseFloat(($id('in_dz')||{value:'0'}).value) || 0,
    jingzhong: calcJZ(inQty, ($id('in_dz')||{value:'0'}).value),   // P0：原为写死的 0
  };

  const modal = $id('inModal');
  const btn = modal ? modal.querySelector('button:last-child') : null;
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }

  try {
    const apiPath = isIn ? '/stock/in' : '/stock/out';
    const res = await api(BASE + apiPath, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify([row]),
    });
    if (res && res.error) throw new Error(res.error);   // Step C：后端 200 + {"error"} 的业务错误 → 走 catch（❌ 提示 + 按钮恢复 + 弹窗留下可重试）
    const icNo = res.items ? res.items[0].ic_no : res.ic_no || '';
    toast(`✅ ${isIn ? '入库' : '出库'}成功 ${icNo}`);
    if (modal) modal.remove();
    if (stockData && stockData.prd_no) stockSearchByPRD(stockData.prd_no);
  } catch(e) {
    toast('❌ ' + (isIn ? '入库' : '出库') + '失败: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = isIn ? '✓ 确认入库' : '✓ 确认出库'; }
  }
}

async function doTransfer(prd_no, wh, wh_name, qty) {
  const wh1 = ($id('tf_wh')||{value:wh}).value.trim() || wh;
  const wh2 = ($id('tf_wh2')||{value:''}).value.trim();
  const tfQty = parseFloat(($id('tf_qty')||{value:'0'}).value) || 0;
  if (!wh2) { toast('⚠️ 请选择收货仓'); return; }
  if (tfQty <= 0) { toast('⚠️ 数量必须大于 0'); return; }
  const tool_rows = [];
  for (let i = 0; i < _tf_tool_count; i++) {
    const code = ($id('tf_tool_' + i)||{value:''}).value.trim();
    const tqty = parseInt(($id('tf_tool_qty_' + i)||{value:'1'}).value) || 1;
    if (code) tool_rows.push({ code, qty: tqty });

  const rows = [{
    prd_no, qty: tfQty, wh: wh1, wh2,
    ref_itm: ($id('tf_ref')||{value:''}).value.trim(),
    ddjh: ($id('tf_ddjh')||{value:''}).value.trim(),
    cus_no: ($id('tf_cus')||{value:''}).value.trim(),
    danzhong: parseFloat(($id('tf_dz')||{value:'0'}).value) || 0,
    jingzhong: calcJZ(tfQty, ($id('tf_dz')||{value:'0'}).value),   // 原为写死的 0（该弹窗当前无入口，删/补入口待定）
  }];
  const modal = $id('transferModal');
  const btn = modal ? modal.querySelector('button:last-child') : null;
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
  try {
    const res = await api(BASE + '/stock/transfer', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items: rows, tool_rows}),
    });
    if (res && res.error) throw new Error(res.error);   // Step C：后端 200 + {"error"} 的业务错误 → 走 catch（❌ 提示 + 按钮恢复 + 弹窗留下可重试）

    toast('❌ 调拨失败: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '✓ 确认调拨'; }
  }
}
